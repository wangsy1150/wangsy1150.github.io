<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0}
body{background:transparent;overflow:hidden;width:150px;height:220px}
#live2d{position:absolute;left:0;bottom:0}
</style>
</head>
<body>
<script src="https://fastly.jsdelivr.net/npm/live2d-widget@3.1.4/lib/L2Dwidget.min.js"></script>
<script>
  // var modelJson = "https://fastly.jsdelivr.net/npm/live2d-widget-model-tororo@1.0.5/assets/tororo.model.json"
  // modelJson = "https://fastly.jsdelivr.net/npm/live2d-widget-model-shizuku@1.0.5/assets/shizuku.model.json"
  modelJson = "https://unpkg.com/live2d-widget-model-miku@1.0.5/assets/miku.model.json"
  // modelJson = "https://unpkg.com/live2d-widget-model-haruto@1.0.5/assets/haruto.model.json"
  // modelJson = "https://unpkg.com/live2d-widget-model-chitose@1.0.5/assets/chitose.model.json"
L2Dwidget.init({
  model:{jsonPath:modelJson},
  display:{position:"left",width:150,height:220,vOffset:0,hOffset:0},
  react:{opacityDefault:1},
  tagMode:false,debug:false
});
</script>
</body>
</html>
