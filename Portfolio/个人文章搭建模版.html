<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="icon" type="image/svg+xml" href="../favicon.svg?v=2">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>博客文章速写器</title>
<script src="../vendor/marked.min.js"></script>
<style>
  @font-face{font-family:"Noto Sans SC";font-style:normal;font-weight:400;font-display:swap;
    src:url("../fonts/NotoSansSC-400-subset.woff2") format("woff2")}
  @font-face{font-family:"Noto Sans SC";font-style:normal;font-weight:500;font-display:swap;
    src:url("../fonts/NotoSansSC-500-subset.woff2") format("woff2")}
  @font-face{font-family:"Noto Sans SC";font-style:normal;font-weight:600;font-display:swap;
    src:url("../fonts/NotoSansSC-600-subset.woff2") format("woff2")}
  @font-face{font-family:"Noto Sans SC";font-style:normal;font-weight:700;font-display:swap;
    src:url("../fonts/NotoSansSC-700-subset.woff2") format("woff2")}
:root {
  --bg: #fafaf8;
  --surface: #ffffff;
  --border: #e8e6e1;
  --text: #1c1c1c;
  --text-secondary: #6b6b6b;
  --text-tertiary: #9e9e9e;
  --accent: #1a1a1a;
  --link: #1a56db;
  --link-hover: #1040b0;
  --tag-bg: #f3f3f0;
  --tag-text: #555;
  --code-bg: #f5f5f2;
  --shadow-xs: 0 1px 2px rgba(0,0,0,0.03);
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.03);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.05);
  --radius: 6px;
  --radius-lg: 10px;
  --font-sans: "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
  --font-mono: "JetBrains Mono", "Fira Code", "SF Mono", "Consolas", "Monaco", monospace;
  --font-serif: "Noto Serif SC", "Source Han Serif SC", "STSong", "Songti SC", "SimSun", Georgia, "Times New Roman", serif;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ── Header ── */
.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 14px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  position: sticky;
  top: 0;
  z-index: 50;
}
.header-left { display:flex; align-items:center; gap:14px; }
.header-logo {
  width: 32px; height: 32px;
  background: var(--accent);
  color: #fff;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -0.5px;
}
.header-title { font-size: 16px; font-weight: 600; color: var(--text); letter-spacing: -0.2px; }
.header-nav {
  display: flex; align-items: center; gap: 6px;
  font-size: 13px; color: var(--text-secondary);
}
.header-nav a {
  color: var(--text-secondary); cursor: pointer;
  text-decoration: none; transition: color 0.15s;
}
.header-nav a:hover { color: var(--text); }
.header-nav .sep { color: #ccc; margin: 0 4px; user-select: none; }
.header-actions { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }

/* ── Buttons ── */
.btn {
  display:inline-flex; align-items:center; gap:5px;
  padding:8px 16px; border-radius:20px; border:1px solid var(--border);
  background:var(--surface); color:var(--text); cursor:pointer;
  font-size:13px; font-weight:500; font-family:var(--font-sans);
  white-space:nowrap; transition:all 0.18s;
  letter-spacing: -0.1px;
}
.btn:hover { background:#f5f5f2; border-color:#d5d3ce; }
.btn-primary { background:var(--accent); color:#fff; border-color:var(--accent); }
.btn-primary:hover { background:#333; border-color:#333; }
.btn-outline { background:transparent; border-color:var(--border); }
.btn-outline:hover { background:#f5f5f2; }
.btn-sm { padding:5px 12px; font-size:12px; }
.btn-xs { padding:3px 9px; font-size:11px; }
.btn-icon {
  padding:7px 9px; min-width:34px; justify-content:center;
  border-radius:var(--radius); font-size:14px;
}

/* ── Gallery ── */
.gallery-hero {
  text-align: center;
  padding: 80px 24px 48px;
  max-width: 560px;
  margin: 0 auto;
}
.gallery-hero h1 {
  font-size: clamp(26px, 3.6vw, 38px); font-weight: 700;
  letter-spacing: -0.5px; margin-bottom: 12px;
  color: var(--text);
}
.gallery-hero p {
  font-size: 17px; color: var(--text-secondary);
  line-height: 1.7; margin-bottom: 28px;
}
.gallery-hero .btn {
  font-size: 14px; padding: 10px 24px;
}

.gallery-container {
  max-width:min(1600px,100%); margin: 0 auto; padding: 0 32px 80px;
}
.gallery-section-title {
  font-size: 13px; font-weight: 600; color: var(--text-tertiary);
  text-transform: uppercase; letter-spacing: 0.8px;
  margin-bottom: 18px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 16px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 28px 26px 22px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: var(--accent);
  transform: scaleX(0);
  transition: transform 0.25s ease;
  transform-origin: left;
}
.card:hover { border-color:#ccc; box-shadow: var(--shadow-md); transform: translateY(-2px); }
.card:hover::before { transform: scaleX(1); }

.card-meta { font-size: 11px; font-weight: 600; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
.card-type-icon { display:inline-block; margin-right: 4px; }
.card h3 { font-size: 18px; font-weight: 700; line-height: 1.45; margin-bottom: 8px; letter-spacing: -0.2px; }
.card-desc { font-size: 14px; color: var(--text-secondary); line-height: 1.65; flex:1; margin-bottom: 18px; }
.card-bottom {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 12px; color: var(--text-tertiary);
  border-top: 1px solid #f3f3f0; padding-top: 14px;
}
.card-bottom .hint { color: var(--link); font-weight: 500; opacity:0; transition:opacity 0.2s; }
.card:hover .card-bottom .hint { opacity:1; }

/* ── Editor Layout ── */
.editor-wrapper {
  max-width:min(1600px,100%); margin: 0 auto; padding: 24px 32px;
  height: calc(100vh - 72px);
  display: flex; flex-direction: column; gap: 0;
}

.editor-toolbar {
  display: flex; align-items: center; gap: 2px;
  padding: 8px 4px; margin-bottom: 6px;
  flex-wrap: wrap;
}
.editor-toolbar .btn-icon { border:1px solid transparent; }
.editor-toolbar .btn-icon:hover { background:#f3f3f0; border-color:var(--border); }
.editor-toolbar .divider { width:1px; height:20px; background:var(--border); margin:0 6px; }

.editor-main { display:flex; gap:20px; flex:1; min-height:0; }

.editor-panel {
  flex:1; min-width:0;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-xs);
  display:flex; flex-direction:column;
  overflow:hidden;
}

/* ── Title & tags header ── */
.editor-panel-header {
  padding: 20px 28px 0;
  border-bottom: 1px solid #f3f3f0;
}
#titleInput {
  width:100%; border:none; outline:none;
  font-size: 28px; font-weight: 700; font-family: var(--font-sans);
  padding: 4px 0; color: var(--text); background: transparent;
  letter-spacing: -0.4px;
}
#titleInput::placeholder { color: #ccc; }
.editor-meta-row {
  display: flex; align-items: center; gap: 10px;
  margin: 12px 0 14px; flex-wrap: wrap;
}
.editor-meta-label { font-size: 12px; color: var(--text-tertiary); font-weight: 500; white-space:nowrap; }

.tag-chip {
  display:inline-flex; align-items:center; gap:3px;
  padding:4px 12px; background:var(--tag-bg); border-radius:20px;
  font-size:12px; color:var(--tag-text); font-weight:500;
}
.tag-chip .tag-x { cursor:pointer; font-size:15px; line-height:1; color:#aaa; margin-left:2px; }
.tag-chip .tag-x:hover { color:var(--text); }
#tagInputInline {
  border:none; outline:none; font-size:12px; padding:4px 6px; min-width:90px;
  background:transparent; font-family:var(--font-sans); color:var(--text);
}
#tagInputInline::placeholder { color:#ccc; }

/* ── Textarea ── */
.editor-body { flex:1; display:flex; flex-direction:column; position:relative; min-height:0; }
.editor-body textarea {
  flex:1; width:100%; border:none; outline:none; resize:none;
  font-size: 15px; line-height: 1.85; color: var(--text);
  background: transparent;
  font-family: var(--font-mono);
  padding: 24px 28px;
}
.editor-body textarea::placeholder { color: #d0d0d0; }

.editor-footer {
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding:10px 20px; border-top:1px solid #f3f3f0; flex-shrink:0; flex-wrap:wrap;
}
.footer-stats { display:flex; gap:18px; font-size:11px; color:var(--text-tertiary); }
.footer-stats strong { color:var(--text); font-weight:600; }
.footer-save { font-size:11px; color:#4caf50; display:flex; align-items:center; gap:4px; opacity:0; transition:opacity 0.4s; }
.footer-save.visible { opacity:1; }

/* ── Preview ── */
.preview-body { flex:1; overflow-y:auto; padding: 28px 36px 36px; }
.preview-content {
  font-family: var(--font-serif);
  font-size: 16px; line-height: 1.95; color: #242424;
  max-width: 680px;
}
.preview-content h1 {
  font-family: var(--font-sans); font-size: 30px; font-weight: 800;
  margin: 0 0 24px; letter-spacing: -0.4px; line-height: 1.3;
}
.preview-content h2 {
  font-family: var(--font-sans); font-size: 21px; font-weight: 700;
  margin: 42px 0 14px; padding-bottom: 10px;
  border-bottom: 1px solid #ebeae6; letter-spacing: -0.2px;
}
.preview-content h3 {
  font-family: var(--font-sans); font-size: 17px; font-weight: 700;
  margin: 30px 0 10px; color: #111;
}
.preview-content p { margin: 14px 0; }
.preview-content ul, .preview-content ol { padding-left: 26px; margin: 12px 0; }
.preview-content li { margin: 6px 0; }
.preview-content strong { color: #000; }
.preview-content a { color:var(--link); text-decoration:none; border-bottom:1px solid #c8d6f0; }
.preview-content a:hover { border-bottom-color:var(--link); }
.preview-content code {
  font-family: var(--font-mono); background: var(--code-bg);
  padding: 2px 6px; border-radius: 3px; font-size: 0.88em; color: #c7254e;
}
.preview-content pre {
  background: #1a1a1e; color: #e0e0e0;
  padding: 20px 24px; border-radius: var(--radius-lg);
  overflow-x: auto; margin: 18px 0; font-size: 13px; line-height: 1.7;
  font-family: var(--font-mono);
}
.preview-content pre code { background:none; padding:0; color:inherit; font-size:inherit; }
.preview-content blockquote {
  border-left: 3px solid #d5d3ce; margin: 20px 0;
  padding: 8px 20px; color: #555; font-style: italic;
}
.preview-content img { max-width:100%; border-radius:var(--radius-sm); margin:12px 0; }
.preview-content table { border-collapse:collapse; width:100%; margin:18px 0; font-size:14px; }
.preview-content th, .preview-content td {
  border:1px solid #e8e6e1; padding:10px 14px; text-align:left;
}
.preview-content th { background:#fafaf7; font-weight:600; }
.preview-content hr { border:none; border-top:1px solid #e8e6e1; margin:36px 0; }

.preview-empty {
  display:flex; flex-direction:column; align-items:center;
  justify-content: center; height:100%;
  color: #d5d3ce; text-align:center; padding:60px 40px;
}
.preview-empty .icon { font-size: 48px; margin-bottom: 12px; opacity:0.5; }
.preview-empty p { font-family:var(--font-sans); font-size:15px; }

/* ── Outline ── */
.outline-panel {
  width: 200px; flex-shrink: 0;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); box-shadow: var(--shadow-xs);
  display: flex; flex-direction: column; overflow: hidden;
}
.outline-panel-header {
  padding: 14px 16px; border-bottom: 1px solid #f3f3f0;
  font-size: 11px; font-weight: 600; color: var(--text-tertiary);
  text-transform: uppercase; letter-spacing: 0.6px;
}
.outline-panel-body { flex:1; overflow-y:auto; padding:8px; }
.outline-item {
  display: block; padding: 6px 12px; font-size: 12px;
  color: var(--text-secondary); cursor: pointer;
  border-radius: var(--radius-sm); text-decoration: none;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  transition: all 0.12s; border-left: 2px solid transparent;
  font-family: var(--font-sans);
}
.outline-item:hover { background:#f5f5f2; color:var(--text); }
.outline-item.l2 { font-weight: 600; }
.outline-item.l3 { padding-left: 24px; font-size: 11px; }
.outline-item.active { border-left-color: var(--accent); color: var(--text); background: #f5f5f2; }
.outline-empty { font-size:12px; color:#ccc; text-align:center; padding:24px 12px; }

/* ── Toast ── */
.toast {
  position:fixed; bottom:40px; left:50%; transform:translateX(-50%);
  background: #1c1c1c; color:#fff; padding:10px 22px;
  border-radius: 20px; font-size:13px; font-family:var(--font-sans);
  opacity:0; pointer-events:none; transition:opacity 0.3s;
  z-index:999; box-shadow: 0 8px 24px rgba(0,0,0,0.15);
}
.toast.show { opacity:1; }

/* ── Focus mode ── */
body.focus .outline-panel,
body.focus .preview-panel { opacity:0.12; transition:opacity 0.3s; pointer-events:none; }
body.focus .editor-toolbar { opacity:0.2; transition:opacity 0.3s; }
body.focus .header { opacity:0.2; transition:opacity 0.3s; }
body.focus .outline-panel:hover,
body.focus .preview-panel:hover,
body.focus .editor-toolbar:hover,
body.focus .header:hover { opacity:1; pointer-events:auto; }

/* ── Responsive ── */
@media (max-width:1100px) { .outline-panel { display:none; } }
@media (max-width:768px) {
  .header { padding:10px 14px; }
  .gallery-hero { padding:40px 16px 24px; }
  .gallery-hero h1 { font-size:28px; }
  .gallery-container { padding: 0 16px 48px; }
  .grid { grid-template-columns:1fr; gap:12px; }
  .card { padding:22px 20px 18px; }
  .editor-wrapper { padding:12px; height:auto; }
  .editor-main { flex-direction:column; }
  .editor-panel { min-height:400px; }
  .editor-panel-header { padding:14px 16px 0; }
  #titleInput { font-size:22px; }
  .editor-body textarea { padding:16px; font-size:14px; }
  .preview-body { padding:18px; }
  .editor-toolbar { gap:1px; }
  .editor-toolbar .btn-icon { padding:5px 7px; min-width:28px; font-size:13px; }
}

/* ── 统一壳（作品集入口） ── */
.back-link {
  font-size: 13px;
  color: var(--text-tertiary);
  text-decoration: none;
  transition: color .15s;
  white-space: nowrap;
}
.back-link:hover { color: var(--text); }
.header-divider {
  width: 1px; height: 18px;
  background: var(--border);
  flex: none;
}
.proj-num {
  display: inline-block;
  font-size: 12px;
  font-weight: 600;
  /* 中文不适合大写字距，.14em 会把「创意工具」拆散 */
  letter-spacing: .06em;
  color: #fff;
  background: linear-gradient(100deg, #3E9FE0 0%, #E8455F 72%, #D62F4A 100%);
  border-radius: 999px;
  padding: 6px 16px;
  margin-bottom: 20px;
  box-shadow: 0 8px 22px rgba(214,47,74,.30);
}
@media (max-width: 720px) {
  .header { padding: 12px 16px; }
  .header-left { gap: 10px; }
  .header-divider { display: none; }
  .gallery-hero { padding: 48px 20px 36px; }
}
</style>
</head>
<body>

<!-- ── Header ── -->
<header class="header">
  <div class="header-left">
    <a class="back-link" href="../index.html">← 返回作品集</a>
    <span class="header-divider"></span>
    <div class="header-logo">B</div>
    <span class="header-title">博客速写</span>
    <span class="header-nav" id="headerNav">
      <a onclick="showGallery()">模板</a>
      <span class="sep" id="navSep" style="display:none;">/</span>
      <span id="navCur" style="color:var(--text-tertiary);"></span>
    </span>
  </div>
  <div class="header-actions" id="headerActions"></div>
</header>

<!-- ── Gallery ── -->
<div id="galleryView">
  <div class="gallery-hero">
    <div class="proj-num">PROJECT 26 · 创意工具</div>
    <h1>选一个模板，开始写作</h1>
    <p>六篇完整的范文，覆盖爬虫逆向、极简入门、算法模板、数据可视化、AI 踩坑和结论复盘。每一篇的代码都能直接跑，选一篇加载到编辑器，在它的基础上修改。</p>
    <button class="btn btn-primary" onclick="startBlank()">从空白开始</button>
  </div>
  <div class="gallery-container">
    <div class="gallery-section-title">全部模板</div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<!-- ── Editor ── -->
<div id="editorView">
  <div class="editor-wrapper">
    <!-- Formatting toolbar -->
    <div class="editor-toolbar">
      <button class="btn btn-icon btn-sm" onclick="insertMD('**','**','粗体')" title="粗体 Ctrl+B"><b style="font-size:14px;">B</b></button>
      <button class="btn btn-icon btn-sm" onclick="insertMD('*','*','斜体')" title="斜体 Ctrl+I"><i style="font-size:14px;">I</i></button>
      <button class="btn btn-icon btn-sm" onclick="insertMD('`','`','')" title="行内代码 Ctrl+`" style="font-family:var(--font-mono);font-size:12px;">&lt;/&gt;</button>
      <span class="divider"></span>
      <button class="btn btn-icon btn-sm" onclick="insertHeading(2)" title="二级标题" style="font-weight:700;">H2</button>
      <button class="btn btn-icon btn-sm" onclick="insertHeading(3)" title="三级标题" style="font-weight:700;font-size:12px;">H3</button>
      <span class="divider"></span>
      <button class="btn btn-icon btn-sm" onclick="insertMD('[','](url)','')" title="链接 Ctrl+K">🔗</button>
      <button class="btn btn-icon btn-sm" onclick="insertList('- ')" title="无序列表">•</button>
      <button class="btn btn-icon btn-sm" onclick="insertList('1. ')" title="有序列表">1.</button>
      <button class="btn btn-icon btn-sm" onclick="insertMD('> ','','')" title="引用">❝</button>
      <button class="btn btn-icon btn-sm" onclick="insertBlock('code')" title="代码块">{ }</button>
      <button class="btn btn-icon btn-sm" onclick="insertBlock('table')" title="表格">⊞</button>
      <span class="divider"></span>
      <button class="btn btn-icon btn-sm" onclick="insertMD('---','','')" title="分割线">—</button>
      <span style="flex:1;"></span>
      <button class="btn btn-outline btn-sm" id="btnFocus" onclick="toggleFocus()">专注</button>
    </div>

    <div class="editor-main">
      <!-- Editor -->
      <div class="editor-panel" style="flex:1.15;">
        <div class="editor-panel-header">
          <input type="text" id="titleInput" placeholder="文章标题" oninput="onEditorChange()">
          <div class="editor-meta-row">
            <span class="editor-meta-label">标签</span>
            <span id="tagChips" style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;">
              <input type="text" id="tagInputInline" placeholder="回车添加标签…" onkeydown="handleTagKey(event)" onblur="commitTag()">
            </span>
          </div>
        </div>
        <div class="editor-body">
          <textarea id="editor" placeholder="开始写……" oninput="onEditorChange()" onkeydown="handleTab(event)" onscroll="syncOutline()"></textarea>
        </div>
        <div class="editor-footer">
          <div class="footer-stats">
            <span>字数 <strong id="wordCount">0</strong></span>
            <span>段落 <strong id="paraCount">0</strong></span>
            <span>阅读约 <strong id="readTime">0</strong> 分钟</span>
          </div>
          <div class="footer-save" id="saveInd">✓ 已保存</div>
        </div>
      </div>

      <!-- Preview -->
      <div class="editor-panel preview-panel" style="flex:1.25;">
        <div class="preview-body preview-content" id="preview">
          <div class="preview-empty">
            <span class="icon">¶</span>
            <p>左侧书写，此处实时预览</p>
          </div>
        </div>
      </div>

      <!-- Outline -->
      <div class="outline-panel">
        <div class="outline-panel-header">大纲</div>
        <div class="outline-panel-body" id="outlineBody">
          <div class="outline-empty">标题会出现在这里</div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ── Toast ── -->
<div class="toast" id="toast"></div>

<script>

const TEMPLATES = [{"id":"xianyu-mtop","type":"Python 应用","icon":"🔐","title":"一个 MD5，搞定闲鱼的反爬","desc":"啃完闲鱼 mtop 接口才明白：所谓「算法解析」，很多时候就是把浏览器做过的一个小动作用 Python 重写一遍。全文拆开讲签名里的每个字段。","tags":"逆向, mtop, MD5, 爬虫","words":6715,"readMin":20,"content":"我以前以为反爬是很神秘的东西——什么 IP 指纹、行为画像、深度学习模型，听上去都很高大上。直到我自己啃了一遍闲鱼 mtop 接口，才明白**最常见的反爬，本质上就是一个 MD5**。今天我把自己最早写的版本拆给你看，看完你会发现，所谓\"算法解析\"，很多时候就是把浏览器做的一个小动作用 Python 重写一遍。\n\n### 先看完整脚本\n\n```python\nimport requests, time, hashlib, json\nimport jsonpath, csv\n\nsearch = \"篮球鞋\"\nsend_url = \"https://h5api.m.goofish.com/h5/mtop.taobao.idlemtopsearch.pc.search/1.0/\"\n\nsend_h = {\n    \"user-agent\": \"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 \"\n                  \"(KHTML, like Gecko) Chrome/149.0.0.0 Safari/537.36\",\n    \"referer\":    \"https://www.goofish.com/\",\n    \"cookie\":     \"<YOUR_XIANYU_COOKIE_HERE>\",   # 必须含 _m_h5_tk\n}\n\npayload = {\n    \"pageNumber\": 1, \"keyword\": search, \"fromFilter\": False,\n    \"rowsPerPage\": 30, \"sortValue\": \"\", \"sortField\": \"\",\n    \"customDistance\": \"\", \"gps\": \"\", \"propValueStr\": {},\n    \"customGps\": \"\", \"searchReqFromPage\": \"pcSearch\",\n    \"extraFilterValue\": \"{}\", \"userPositionJson\": \"{}\",\n}\nc_data = json.dumps(payload)\n\ndef get_sign(cookie_str, c_data):\n    # 1. 从 Cookie 里抠出 _m_h5_tk，取最后一段的 token\n    pairs = cookie_str.split(\"; \")\n    token_list = [item.split(\"=\", 1)[1].split(\"_\")[0]\n                  for item in pairs if item.startswith(\"_m_h5_tk=\")]\n    if not token_list:\n        raise ValueError(\"Cookie 内未找到 _m_h5_tk 字段！\")\n    d_token = token_list[-1]\n\n    # 2. 生成 13 位毫秒时间戳\n    t = str(int(time.time() * 1000))\n    h = \"34839810\"                              # appKey\n\n    # 3. 拼原始串 + MD5\n    raw = f\"{d_token}&{t}&{h}&{c_data}\"\n    md5 = hashlib.md5(raw.encode(\"utf-8\"))\n    return t, md5.hexdigest()\n\nt, sign = get_sign(send_h[\"cookie\"], c_data)\n\n# 4. 把 sign 塞进 URL query，再 POST\nxy_params = {\n    \"jsv\": \"2.7.2\", \"appKey\": \"34839810\",\n    \"t\": t, \"sign\": sign,\n    \"v\": \"1.0\", \"type\": \"originaljson\",\n    \"accountSite\": \"xianyu\", \"dataType\": \"json\",\n    \"timeout\": \"20000\",\n    \"api\": \"mtop.taobao.idlemtopsearch.pc.search\",\n    \"sessionOption\": \"AutoLoginOnly\",\n    \"spm_cnt\": \"a21ybx.search.0.0\",\n    \"spm_pre\": \"a21ybx.search.searchInput.0\",\n}\ndatas = {\"data\": c_data}\n\nres = requests.post(send_url, headers=send_h, params=xy_params, data=datas)\nresdata = res.json()\n\n# 5. jsonpath 跨层级抓数据\nexContent = jsonpath.jsonpath(resdata, \"$..exContent\")\nall_data = []\nfor i in exContent:\n    try:\n        all_data.append([\n            i[\"detailParams\"][\"title\"][:15],\n            i[\"area\"],\n            i[\"detailParams\"][\"soldPrice\"],\n        ])\n    except: pass\n\nwith open(\"闲鱼数据_篮球鞋.csv\", \"w\", newline=\"\", encoding=\"utf-8\") as f:\n    cf = csv.writer(f)\n    cf.writerow([\"标题\", \"地址\", \"价格\"])\n    cf.writerows(all_data)\n```\n\n整个脚本的核心不是 `requests`，是那个 `get_sign()`。\n\n### mtop 是什么？一句话讲清\n\n淘系（淘宝/天猫/闲鱼/支付宝...）的前端接口有一层统一的鉴权封装，叫 **mtop**。它的全称是 `mtop.taobao.xxx`，所有 H5 页面拿数据都走它。\n\nmtop 的反爬不是 IP 指纹，不是人机验证，**就是一个签名 + 一个时间戳**：\n\n```\nsign = md5(token & t & appKey & data)\n```\n\n- `token`：从 Cookie 里抠出来的 `_m_h5_tk`；\n- `t`：当前毫秒时间戳；\n- `appKey`：写死在客户端里的常量字符串，闲鱼搜索是 `34839810`；\n- `data`：本次请求的 payload 序列化后的 JSON 字符串。\n\n四个东西一拼，MD5 加密，得到 32 位小写 hex，**就是 sign**。\n\n### 为什么是 `_m_h5_tk`，不是别的 Cookie\n\n```python\ntoken_list = [item.split(\"=\", 1)[1].split(\"_\")[0]\n              for item in pairs if item.startswith(\"_m_h5_tk=\")]\n```\n\nCookie 里这一长串 `_m_h5_tk=f367c39421be01aa446b45d284ba96b0_1785247373395` 里**下划线前面那一段**（`f367c39421be01aa446b45d284ba96b0`）才是 token。\n\n为什么是这一段？因为服务端只认 token 这 32 位字符，**后面的时间戳过期信息由客户端自己用，签名时不参与**。\n\n注意 `token_list[-1]`：cookie 字符串里 `_m_h5_tk` 经常出现两次（一个是明文、一个是加密版 `_m_h5_tk_enc`），永远取最后一个。**这是闲鱼这个接口的\"小坑\"，很多新人在这里栽过**。\n\n### 时间戳必须是 13 位毫秒\n\n```python\nt = str(int(time.time() * 1000))\n```\n\n`time.time()` 默认是**秒级浮点**（如 `1726204432.847`），乘 1000 后是毫秒级整数。mtop 严格要求 13 位毫秒戳，**少一位或多一位都会被服务端拒绝**。\n\n要不要担心时钟漂移？**不需要**。mtop 服务端的容忍窗口是 ±5 分钟，正常笔记本时钟不会差这么多。但如果你的脚本跑在树莓派或老机器上，**先 `ntpdate` 同步一下时钟**，否则大概率一直 `FAIL_SYS_SESSION_EXPIRED`。\n\n### sign 必须和 data 严格一致\n\n```python\nraw = f\"{d_token}&{t}&{h}&{c_data}\"\n```\n\n这是签名公式。**关键点：`c_data` 必须和 POST 请求里 `data={\"data\": c_data}` 的内容一模一样**——包括字段顺序、包括空格、包括 `{}` 这种空字典的表示方式。\n\n如果中间你为了\"美化\"调用了 `json.dumps(payload, indent=2, ensure_ascii=False)`，服务端验签**立刻失败**。我当年第一次跑就因为加了 `indent=2` 被拒，调到怀疑人生才意识到是 JSON 格式不一致。\n\n```python\n# 正确：c_data = json.dumps(payload)\n# 错误：c_data = json.dumps(payload, indent=2)        # 多了换行和空格\n# 错误：c_data = json.dumps(payload, sort_keys=True)  # 字段顺序变了\n```\n\n### 参数要塞对地方\n\n```python\nxy_params = { \"t\": t, \"sign\": sign, \"appKey\": \"34839810\", ... }\ndatas = { \"data\": c_data }\n\nres = requests.post(send_url, headers=send_h, params=xy_params, data=datas)\n```\n\n注意三件事：\n\n- `t`、`sign`、`appKey`、`jsv` 等鉴权参数走 **URL query**（`params=`），不进 body；\n- `data` 走 **POST body**（`data=`）；\n- 服务端会从 URL 里读 sign，从 body 里读 data，**两边都要对得上**。\n\n混了任何一个地方，mtop 返回的都是同一句：`FAIL_SYS_SIGNATURE_ERROR`。\n\n### jsonpath 跨层级抓数据\n\n```python\nexContent = jsonpath.jsonpath(resdata, \"$..exContent\")\n```\n\n`$..exContent` 是 jsonpath 的**递归下降**语法，意思是\"从根节点开始，不限层级，凡是 key 叫 `exContent` 的全要\"。mtop 返回的 JSON 结构非常深（用户数据/商品数据/模板数据嵌套十几层），用普通字典访问会很累，**jsonpath 是为这种\"深嵌套 JSON\"而生的工具**。\n\n`jsonpath.jsonpath()` 返回的是一个**列表**，需要遍历才能拿到每个商品对象。\n\n### 那段又长又丑的 Cookie，请你立刻删掉\n\n和上一篇 B 站下载一样，**这个脚本里的 cookie 也是真实凭据**，里面含 `_m_h5_tk`、`_tb_token_`、`unb`、`tracknick` 等关键字段：\n\n- `_m_h5_tk`：签名的原料，泄露等于别人能以你的身份调 mtop；\n- `_tb_token_`：登录态绑定值，泄露等于账号白送；\n- `tracknick`：你的昵称，泄露不算大碍但暴露身份。\n\n正确做法和上一篇一致：挪进 `.env`，从 `os.environ['XIANYU_COOKIE']` 读，`.env` 进 `.gitignore`。**这是底线，不是建议**。\n\n### mt 签名算法的本质\n\n写到这儿你应该看出来了，**mtop 这套反爬并不\"反\"**：\n\n- 算法公开（前端 JS 源码就在浏览器 Network 里）；\n- 公式简单（一个 MD5）；\n- 数据透明（所有原料都来自你自己的 Cookie 和请求 body）。\n\n它\"反\"的从来不是技术破解者，**反的是用裸 `requests.get` 抄页面的低水平爬虫**。任何一个愿意花 20 分钟看 Network 的人，都能复现它。\n\n### 当 mtop 改动时，怎么应对\n\nmtop 不是一成不变的。你大概率会遇到这些变化：\n\n- **appKey 变更**：淘宝每几年会换一次 appKey，每次换都要重新抓前端 JS。\n- **token 提取规则**：以前是 `_m_h5_tk` 下划线前面那段，后来出现过\"倒数第二段\"的情况。\n- **新增参数**：比如某次升级要求 sign 里再加 `ua` 或 `v`。\n- **token 加密**：出现过 `_m_h5_tk_enc`（AES 加密版），需要前端 JS 解密才能拿原始 token。\n\n应对策略：\n\n- **不要硬编码常量**：appKey、JS 版本号都做成配置项；\n- **关注 mtop 官方升级公告**：每次大促前后是高危期；\n- **保留一份能跑的\"基线版本\"**：每次升级前后比对，定位变化点。\n\n### 写在最后\n\nmtop 签名解析是爬虫世界里非常典型的一类问题——**看起来神秘，本质朴素**。把这套流程搞懂，你会得到一个意外收获：**所有走淘系 mtop 的 H5 页面，你都能爬**。淘宝商品详情、天猫店铺、支付宝账单、闲鱼商品，骨架都一样，**字段名改一改、appKey 换一换**就行。\n\n下一步建议做三件事：\n\n- 把 sign 算法抽成 `lib/sign.py`，配合 `cookie_pool.json` 做多账号轮询；\n- 用 `retrying` 或 `tenacity` 加自动重试，配合 `random.uniform(2, 5)` 随机等待；\n- 把抓到的数据落到 SQLite，跑一个 pyecharts 看板，分析\"哪些关键词的成交量涨得最快\"。\n\n爬虫这件事，**重要的不是你今天下到多少数据，而是你能不能把它变成持续可用的信号**。md5 只是起点，工程化才是终点。\n\n### 免责声明（请务必读完）\n\n- **闲鱼 / 淘宝 / 天猫的 mtop 接口属于阿里内部资源**，调用它意味着你在和阿里的风控系统直接对话。任何形式的**未授权批量抓取、商业转售、绕过人机验证**都违反用户协议，也可能触发账号封禁甚至法律责任。\n- **Cookie 是个人登录态凭据**，**严禁出现在博客、GitHub、群聊截图、技术问答里**。本文代码块中的 `<YOUR_XIANYU_COOKIE_HERE>` 不是装饰，是底线。\n- **个人学习、小量下载、不传播、不商用、不影响平台正常运行**——这是我能给的最宽边界。超过这条线，请走平台的开放接口或签合作协议。\n- **mtop 签名算法随时可能升级**，本文示例仅供学习\"思路\"，实际使用请以闲鱼当前接口为准，自负其责。\n- **出了问题，与本文无关**。脚本运行造成的账号封禁、设备损坏、数据丢失、法律纠纷，均由使用者自行承担。\n\n技术是工具，**不是免责符**。把它用在合法、正当、有边界的场景里——这是我能给你的最后一点职业建议。"},{"id":"music-25-lines","type":"Python 入门","icon":"🎵","title":"25 行 Python，下一首歌","desc":"不到 25 行，把一首歌从搜索到落盘完整跑通：搜页 → 详情页 → 播放 API → 写文件。只要 requests 和 lxml。","tags":"爬虫, 极简, requests, 零成本","words":4637,"readMin":14,"content":"我常被人问\"Python 爬虫到底能写多短\"。以前我会甩一段 50 行、80 行的代码出来，今天我想给你看一段真正极简的——25 行不到，把一首歌从搜索到落盘完整跑通。看完你会发现，所谓\"爬虫工程师\"做的事情没那么神秘，大部分时候就是 **搜页 → 详情页 → 播放 API → 写文件** 这四步。\n\n### 先看完整脚本\n\n```python\nimport requests\nfrom lxml import etree\nimport json\n\nurl = \"https://www.gequbao.com/s/%E5%91%A8%E6%9D%B0%E4%BC%A6\"\nheaders = {\n    \"user-agent\": \"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 \"\n                  \"(KHTML, like Gecko) Chrome/135.0.0.0 Safari/537.36\",\n}\n\nres = requests.get(url=url, headers=headers)\ndata = etree.HTML(res.text)\ninfo = data.xpath('//div[@class=\"col-9 col-md-8\"]')   # 每首歌一个 div\n\nfor i in info[0:3]:\n    title = i.xpath('.//span/text()')[0].strip()\n\n    # 第一跳：列表页 → 详情页\n    aurl  = i.xpath('./a/@href')[0]\n    zwurl = \"https://www.gequbao.com\" + aurl\n    zwdata = requests.get(zwurl, headers=headers).text.replace('\\\\u0022', '\"')\n\n    # 从详情页源码里挖出 play_id\n    pid = zwdata.split('\"play_id\":\"')[1].split('\"')[0]\n\n    # 第二跳：详情页 → 真实下载地址\n    api  = \"https://www.gequbao.com/api/play-url\"\n    gequ = requests.post(api, headers=headers, data={\"id\": pid}).json()\n    musicurl = gequ[\"data\"][\"url\"]\n\n    # 落盘\n    mures = requests.get(musicurl, headers=headers)\n    with open(f\"{title}.mp3\", \"wb\") as f:\n        f.write(mures.content)\n```\n\n25 行。真的就这么多。\n\n### 为什么是 xpath，不是正则？\n\n很多新人爬虫教程一上来就教 `re.findall`，但**真正工业级的爬虫，几乎不用正则匹配 HTML**。原因有三：\n\n- HTML 是结构化文档，xpath 走的是 DOM 树，能直接锁定\"第 N 层 / 第 N 个 / 某个 class 的子节点\"，比正则写出来的魔法串好读太多；\n- DOM 是容错的——标签多一个空格、少一个换行，xpath 一般照常命中，正则经常挂；\n- 现代浏览器 DevTools 自带\"Copy XPath\"，开发者不用手写表达式。\n\n对应到代码里这一行：\n\n```python\ninfo = data.xpath('//div[@class=\"col-9 col-md-8\"]')\n```\n\n意思就是\"在整棵 DOM 树里找所有 class 同时包含 `col-9` 和 `col-md-8` 的 div\"——这两列类名是 Bootstrap 栅格的写法，几乎不会和其它 div 撞车，是相当稳的锚点。\n\n### 列表页拿到的是\"半截链接\"\n\n注意这一行：\n\n```python\naurl  = i.xpath('./a/@href')[0]\nzwurl = \"https://www.gequbao.com\" + aurl\n```\n\n列表页的 `<a href=\"/music/8475848\">` 给你的是相对路径，**必须手动拼上 origin**。这种半截链接在爬虫里非常常见，看到 `@href` 没带协议头就要长个心眼。\n\n### 详情页里挖 `play_id`，是个字符串手术\n\n```python\npid = zwdata.split('\"play_id\":\"')[1].split('\"')[0]\n```\n\n这一行长得丑，但理解了就通——把整段 HTML 源码当成字符串，先按 `\"play_id\":\"` 切成两半，第二段里再按 `\"` 切，第一个就是纯净的 id。\n\n为什么不直接用正则？因为 `play_id` 在页面上是个**内嵌 JSON** 的字段，被网站为了反爬故意把双引号转义成 `\\u0022`。`replace('\\\\u0022', '\"')` 是先做一步反转义，把字符串还原成正常 JSON，再做字符串切割。**看起来像正则的活，本质是字符串手术**。\n\n### POST 请求：把 id 喂回去换链接\n\n```python\ngequ = requests.post(api, headers=headers, data={\"id\": pid}).json()\nmusicurl = gequ[\"data\"][\"url\"]\n```\n\n这一步是整个脚本的\"灵魂\"。注意三件事：\n\n- 走的是 `POST`，不是 `GET`——参数在请求体里，不在 URL 里，浏览器历史和日志看不到，相对更隐蔽；\n- 提交的是 `data={\"id\": pid}`，这是表单格式；如果对方要 JSON，要换成 `json={\"id\": pid}`；\n- 返回的是 JSON，所以直接 `.json()` 拿到字典，再走 `[\"data\"][\"url\"]` 拿真正的 mp3 直链。\n\n这一套\"前端拼请求、后端发请求\"的链条，**几乎所有内容站都在用**——B 站、抖音、知乎、闲鱼，只是字段名不同而已。\n\n### 写到本地的最后一步\n\n```python\nwith open(f\"{title}.mp3\", \"wb\") as f:\n    f.write(mures.content)\n```\n\n两件事千万别搞错：\n\n- 模式必须是 `\"wb\"`，**二进制写**。mp3 是字节流，用 `\"w\"` 会在 Windows 上因为编码问题坏文件；\n- 写的是 `mures.content`，不是 `mures.text`。`.text` 是字符串（自动解码），`.content` 是 bytes（原始字节流），下任何媒体文件都用 `.content`。\n\n### 25 行背后看不见的事\n\n脚本跑起来当然没那么丝滑，**真正写爬虫的功夫，都在脚本之外**：\n\n- **请求头要伪装**：裸 `requests.get` 经常被 403，UA、Referer、Cookie 至少要有一个。\n- **频率要克制**：循环里没加 `time.sleep`，一分钟内连发几十个请求，IP 几分钟就被封。生产代码建议加 `random.uniform(1, 3)`。\n- **要断点续跑**：网络断一次就要从头来。可以先把列表页的歌曲 id 列表落盘到 JSON，循环读 JSON，没下完的标记 `pending`，下次接着跑。\n- **要去重**：同一首歌经常在多个搜索结果里出现，最终写入前用 `if title not in done_titles` 跳过。\n- **要日志**：每首歌的状态打到一个 `log.txt`，失败重试。\n\n这些\"脚本之外\"的工程化能力，恰恰是**从作业到生产**的分水岭。\n\n### 把这套打法套到任何内容站\n\n这套\"列表页拿 id → 详情页拿播放参数 → POST/API 换直链 → 落盘\"的四步法，几乎可以套用到所有 UGC 站点：\n\n- B 站：`__playinfo__` 里找 `baseUrl`；\n- 抖音：分享链接里解析 `aweme_id`，再去 `/api/aweme/v1/aweme/detail/` 拿视频流；\n- 知乎：问题的 `/api/v4/questions/{id}/answers` 拿回答列表；\n- 公众号文章：`__NEXT_DATA__` 里有正文 HTML。\n\n字段名千变万化，**思路只有一套**。\n\n### 写在最后\n\n爬虫从来不是\"写得多\"就是高手，**写得多不代表写得好**。一段 25 行的脚本里，藏着对 HTTP、对 HTML、对 JSON、对文件 IO 的完整闭环；把它读懂、改熟、举一反三，比刷十份 500 行的\"大项目\"有用得多。\n\n下一步建议做三件事：把 UA 和 Cookie 挪进 `os.environ`；用 `asyncio + aiohttp` 改成并发下载；给每首歌写一个 SHA1 比对，跳过已下载文件。做完这三件事，你手里就不再是\"作业脚本\"，而是一个**真正能用的工具**。\n\n最后留一句：抓得到不等于抓得对。**所有抓回来的数据，第一时间想清楚怎么用、用在哪、给谁看**——技术是手段，问题才是起点。\n\n### 免责声明（请务必读完）\n\n写到这里必须把丑话讲在前面。本文的代码与思路**仅用于技术学习和个人研究**，请务必遵守以下边界：\n\n- **尊重版权与平台规则**。绝大多数音乐平台的用户协议都明确禁止未经授权的批量下载、绕过付费墙、二次分发。脚本能跑不代表你\"有权跑\"——能下到不等于\"你拥有\"。下载到的 mp3 只供你个人试听、学习，请勿上传网盘、转载、公开传播，更不要用于任何商业用途。\n- **不破坏平台正常运行**。循环里没有 sleep、并发过高、伪造身份绕过付费/登录墙——这些都是《网络安全法》《数据安全法》和《刑法》第 285、286 条里可能踩到的雷。商业爬虫合规问题请咨询律师，不要拿\"个人学习\"当万能挡箭牌。\n- **保护好你自己的账号**。脚本里所有 Cookie / SESSDATA / 登录 token 都属于个人敏感凭据。**任何公开仓库、博客、社交媒体、聊天群截图里都不要贴真实凭据**。本文代码块里的 `<YOUR_xxx_HERE>` 不是装饰，是底线。\n- **网站结构随时变**。今天能用的接口、XPath、字段名，明天可能就 `403` 或改名。代码示例仅供学习\"思路\"，实际使用请以目标站点当前接口为准，自负其责。\n- **出了问题，与本文无关**。脚本运行造成的账号封禁、设备损坏、数据丢失、法律纠纷，均由使用者自行承担。\n\n技术是工具，**不是免责符**。如果你看完觉得\"原来爬虫这么简单\"，请把这份\"简单\"用在合法、正当、有边界的场景里——这是我能给你的最后一点职业建议。"},{"id":"echarts-dashboard","type":"观点思考","icon":"📊","title":"3 万行数据做了块大屏，最值钱的收获是发现自己把结论写死了","desc":"这篇不讲 ECharts 怎么用。讲的是做完 13 张图之后，怎么发现自己把结论写死了、又怎么把判断标准整个换掉。","tags":"ECharts, 数据可视化, 结论校验","words":7152,"readMin":22,"content":"> 这篇不讲\"ECharts 怎么用\"——**怎么把 CSV 画成图，我上一篇 pyecharts 已经写过了**。\n> 这篇讲的是画完图之后才发现的三个坑：**数字是算的，文字是抄的；路径是死的；轴上少了一根线。**\n\n我手上有一份 30,000 行的兼职岗位数据。里面每一行是一个岗位，带技能方向、时薪、日薪、预计月收入、是否远程、成长潜力评分。\n\n我盯着这份 CSV 看了十分钟，脑子里只有一个问题：**\"会 Python 又会 AIGC\"，到底比\"纯基础服务岗\"值钱多少？**\n\n这个问题用嘴回答很容易说错，用一张表回答没人看。所以我做成了一块大屏。\n\n先说结论：**月薪 14,081 元 对 2,809 元，溢价 401.2%。** 下面讲这块屏是怎么算出来、怎么画出来的，以及我做错的两个地方。\n\n### 第一步：先算清指标，再想图怎么画\n\n我一开始就想画图，结果画到一半发现不知道该画什么。**正确顺序是先定指标，图是指标的副产品。**\n\n这份数据里有 5 个技能方向：`基础服务`、`Python`、`Python+AIGC`、`普通数字岗位`、`AIGC`。我只取了两头做对比：\n\n```python\nimport pandas as pd\nimport json\n\ndf = pd.read_csv(CSV, encoding='utf-8-sig')\ncomp = df[df['技能方向'] == 'Python+AIGC']   # 5,032 条\nbase = df[df['技能方向'] == '基础服务']      # 9,253 条\n\ncomp_hour  = round(comp['时薪_元'].mean(), 1)\nbase_hour  = round(base['时薪_元'].mean(), 1)\ncomp_month = round(comp['预计月收入_元'].mean(), 1)\nbase_month = round(base['预计月收入_元'].mean(), 1)\npremium_rate = round((comp_month - base_month) / base_month * 100, 1)\nremote_rate  = round((comp['远程办公'] == '是').mean() * 100, 1)\ngrowth_mean  = round(comp['成长潜力_1至5'].mean(), 2)\nheat_idx     = round(comp['岗位热度指数'].mean(), 1)\n```\n\n`encoding='utf-8-sig'` 这个参数值得单说：Windows 上用 Excel 存过的 CSV 会带 BOM 头，不加 `-sig`，第一个列名会变成 `\\ufeff技能方向`，然后你的 `df['技能方向']` 直接 KeyError。**这个坑我踩过不止一次。**\n\n跑出来的数字（我复算过一遍，和图上一致）：\n\n| 指标 | Python+AIGC | 基础服务 | 差距 |\n|---|---|---|---|\n| 时薪 | 195.4 元 | 29.4 元 | 6.6 倍 |\n| 参考日薪 | 1,160.7 元 | 176.6 元 | 6.6 倍 |\n| 预计月收入 | 14,081.1 元 | 2,809.3 元 | 5.0 倍 |\n| 月薪溢价率 | — | — | **+401.2%** |\n| 远程办公率 | 77.1% | 0% | — |\n| 成长潜力（1-5） | 4.51 | 2.00 | — |\n| 岗位热度指数 | 91.6 | 62.8 | — |\n\n### 一个容易被忽略的除法：把 1-5 分变成百分制\n\n雷达图有六个维度，其中两个是 1-5 分，另外四个是百分比。**单位不统一，画在同一张雷达图上就会失真**——1-5 分的维度会缩在圆心。\n\n所以我写了个小函数做归一化：\n\n```python\ndef s5(v):\n    return round(v / 5 * 100, 1)\n```\n\n`4.5143 → 90.3`。这样六个轴都是 0-100，图形才有可比性。\n\n> 这里有个一分的差别值得记一笔：如果你先把它 `round(..., 2)` 成 `4.51` 再乘，得到的是 **90.2**；而代码里我直接把**未取整的均值**传进去，得到 **90.3**。**先取整再算 ≠ 先算再取整。** 差一分不影响结论，但在报表里对不上数的时候，往往就是这类顺序问题。\n\n**这类\"单位对齐\"的活，是数据可视化里最不显眼、但最容易毁掉一张图的部分。** 它不酷，但少了它，图就是错的。\n\n### 第二步：为什么我用 `__X__` 而不是 f-string\n\n这是我做这个项目学到的第一个真本事。\n\n第一版我用了 f-string：\n\n```python\nhtml = f\"\"\"<style>\n  .kpi {{ border-color: {COLOR}; }}\n</style>\"\"\"\n```\n\n结果直接语法错误。因为 **CSS 里全是 `{}`**，f-string 会把每一个 `{` 当成变量插槽。\n\n改法有两种：把 CSS 里每个 `{` 都写成 `{{`（丑且容易漏），或者——**干脆不用 f-string**。\n\n我选了后者：\n\n```python\nHTML_TEMPLATE = r'''<!DOCTYPE html>\n<html>\n<style>\n  .kpi { --accent: var(--cyan); }     /* 正常写 CSS，不用转义 */\n</style>\n<div class=\"val\" data-target=\"__COMP_MONTH__\">0</div>\n<script>var salaryData = __SALARY_JSON__;<\/script>\n</html>'''\n\nhtml = HTML_TEMPLATE\nhtml = html.replace('__COMP_MONTH__', str(comp_month))\nhtml = html.replace('__SALARY_JSON__', SALARY_JSON)\n```\n\n**用 `r'''` 原始字符串 + 自己定的 `__X__` 占位符。** 好处有三个：\n\n- CSS / JS 里的 `{}` 一个都不用转义\n- 占位符长得像变量，但绝不会和 HTML/CSS/JS 自己的语法撞车\n- `str.replace` 顺序可控，想把 `<script>` 放在哪都行\n\n**这个技巧我后来在考研报告、周报模板里全用上了。** 凡是\"代码里嵌一大段别的语言\"的场景，都适用。\n\n### 第三步：把 Python 数据塞进 JS\n\n图上要用的数据是 Python 算的，JS 得能吃。中间那座桥就是 `json.dumps`：\n\n```python\nsalary_data = {\n    \"categories\": [\"时薪(元)\", \"参考日薪(元)\", \"预计月收入(元)\"],\n    \"comp\": [comp_hour, comp_day, comp_month],\n    \"base\": [base_hour, base_day, base_month],\n}\nSALARY_JSON = json.dumps(salary_data, ensure_ascii=False)\n```\n\n`ensure_ascii=False` 是关键。不加它，中文会变成 `\\u65f6\\u85aa(\\u5143)`——浏览器能显示，但你打开源码一个字都看不懂，调试时想死。\n\n**这一行是整个项目里性价比最高的一个参数。**\n\n### 第四步：两块图\n\n**图一：三个薪资指标 + 溢价倍数。**\n\n柱状图画两组数据，再叠一条折线画\"倍数关系\"：\n\n```javascript\nseries: [\n  { name:'复合型岗位', type:'bar', data: salaryData.comp, label:{show:true, position:'top'} },\n  { name:'基础类岗位', type:'bar', data: salaryData.base, label:{show:true, position:'top'} },\n  { name:'溢价倍数', type:'line', symbol:'diamond',\n    data: salaryData.comp.map(function(v,i){ return v / salaryData.base[i]; }) },\n]\n```\n\n`data` 直接传数组，ECharts 会自己对齐到 `xAxis.data` 的分类上。**不用手动造 `{value:...}` 对象**，这是很多人第一次用 ECharts 会绕的弯。\n\n**图二：六维雷达图。**\n\n```javascript\nradar: { indicator: radarIndicators, radius:'66%' },\nseries: [{ type:'radar', data:[\n  { value: compRadar, areaStyle:{ color: radialGradient }, lineStyle:{ color:'#00f0ff' } },\n  { value: baseRadar, areaStyle:{ color:'rgba(255,174,0,.4)' } },\n]}]\n```\n\n雷达图的价值在于**用面积表达\"综合实力\"**。复合型在成长潜力、技能门槛、岗位热度、远程办公率四个维度全面外扩，包络面积明显大一圈；基础岗只在\"培训可胜任率\"\"高考生适配率\"两个维度顶满——**这两个维度满格，其实是\"谁都能干\"的另一种说法**。\n\n### 第五步：让屏\"活\"起来\n\n大屏如果静止，就是一张图。要让领导觉得\"这是系统\"，得动。\n\n**数字滚动**：用 `requestAnimationFrame` + 缓出曲线。\n\n```javascript\nfunction tick(now){\n  var p = Math.min((now - start) / dur, 1);\n  var e = 1 - Math.pow(1 - p, 3);      // easeOutCubic\n  el.textContent = (target * e).toFixed(1) + suffix;\n  if (p < 1) requestAnimationFrame(tick);\n}\n```\n\n`1 - (1-p)³` 这条曲线让数字**先快后慢**，最后稳稳停住。如果线性增长，看起来像个加载条。\n\n**呼吸动画**：雷达图的填充透明度跟着正弦波变。\n\n```javascript\nsetInterval(function(){ radarPhase += 0.15; radarChart.setOption(radarOption()); }, 80);\n```\n\n80ms 重绘一次，透明度在 `0.85 + 0.15 * sin(phase)` 之间飘。\n\n**轮播高亮**：柱状图每 2.2 秒换一组高亮。\n\n```javascript\nsetInterval(function(){ sIdx = (sIdx + 1) % 3; salaryChart.setOption(salaryOption(sIdx)); }, 2200);\n```\n\n⚠️ **这里有个性能坑要提醒**：`setOption` 默认是**合并**模式，反复调用会累积状态；如果每次都传完整 option 问题不大，但如果只传局部，就会出现\"旧数据没被清掉\"的怪现象。要么传完整 option，要么用 `setOption(opt, true)` 强制替换。\n\n### 第六步：我做的两个错事（这部分才是重点）\n\n**错误一：我把结论文字写死在 HTML 里了。**\n\n大屏上那段\"图表总结分析\"，是我跑完数据之后**手打**进去的：\n\n```html\n时薪 <b>195.4 元</b> 对 <b>29.4 元</b>（溢价 <span class=\"hi\">+564.2%</span>）\n```\n\n看起来很专业对吧？问题在于：**图是算出来的，文字是抄上去的。**\n\n只要 CSV 换一份，柱子会变，那段话一个字都不会变。它不再描述数据，它只是在描述\"我当时看到的数据\"。\n\n**这是可视化里最危险的一种错——它不会报错，不会崩，只是安静地说谎。**\n\n正确做法是把这几个数也变成占位符：\n\n```python\nhtml = html.replace('__COMP_HOUR__', f'{comp_hour}')\nhtml = html.replace('__PREMIUM_HOUR__', f'{round((comp_hour-base_hour)/base_hour*100,1)}')\n```\n\n**凡是和数字有关的字，都不许手打。** 这条规矩我现在写任何报告都遵守。\n\n**错误二：我把绝对路径写死了。**\n\n```python\nCSV = r'<YOUR_PATH>\\兼职岗位数据.csv'\nOUT = r'<YOUR_PATH>\\复合型岗位可视化大屏.html'\n```\n\n当时图省事，直接从资源管理器复制的路径。结果换个电脑、换个文件夹，程序立刻报 `FileNotFoundError`。\n\n正确写法：\n\n```python\nimport os\nBASE = os.path.dirname(os.path.abspath(__file__))\nCSV = os.path.join(BASE, '兼职岗位数据.csv')\nOUT = os.path.join(BASE, '复合型岗位可视化大屏.html')\n```\n\n**`__file__` 是脚本自己的位置，跟着文件走，永远不迷路。** 这个写法该成为默认习惯。\n\n**还有一个我后来才发现的小问题**：那条\"溢价倍数\"折线，数值只有 5.0~6.6，但它和柱状图共用同一个 y 轴（0~14,000）。结果就是折线几乎贴着 x 轴底部，标签都快看不见了。\n\n修法很简单——给它一个副轴：\n\n```javascript\nyAxis: [\n  { type:'value', name:'金额(元)' },\n  { type:'value', name:'倍数', position:'right', max: 8 },\n],\nseries: [{ ... }, { ... }, { type:'line', yAxisIndex: 1 }]\n```\n\n**双轴不是高级技巧，是基本需求：两组量纲不同的数据放一张图，就该给两个轴。** 我第一版忘了，图形能出来，但那条线基本等于没画。\n\n### 写在最后\n\n这块大屏最后的样子我挺满意：深色底、青色光晕、数字滚动、雷达呼吸。但回头看，让它\"好看\"的那些 CSS 动画，加起来不到 200 行；**让它\"可信\"的那些东西——`s5()` 的单位对齐、`ensure_ascii=False`、占位符替换、以及\"不许手打数字\"这条自律——才是技术含量所在。**\n\n我现在给这份数据总结了三个可迁移的判断：\n\n1. **先定指标再画图。** 图是结论的形状，不是起点。\n2. **单位和量纲不一样，就别塞进一个轴。**\n3. **图能自动更新，文字不能。那就让文字也变成变量。**\n\n下一步我想做三件事：把 5 个技能方向全画进去（现在只用了两头，中间三个方向才是真实现状）、把写死的分析文字改成模板拼接、加一个\"按城市筛选\"的交互。\n\n**这块屏本质上是\"把一份看不懂的 CSV 变成一句能说出口的话\"。** 数据分析和可视化的全部意义，我觉得就在这一句里。\n\n### 免责声明（请务必读完）\n\n- **数据来源与真实性由数据提供方负责。** 本文所有数字都在这份 30,000 行的样本上算得，**样本不代表市场全貌**，更不能当作求职或涨薪的依据。\n- **\"薪资均值\"有天然缺陷。** 均值会被极端值拉高，且兼职/全职、一线/三四线混在一起统计时参考价值有限。想看更靠谱的结论，应该看**中位数**和**分城市分布**。这一点我没在图上做，是我的疏漏。\n- **不要把行业对比结论当作择业建议。** \"Python+AIGC 溢价 4 倍\"很可能同时包含\"岗位本身门槛更高\"\"样本采集渠道偏差\"等因素，**相关不等于因果**。\n- **文中代码仅供学习 ECharts 与 pandas 的用法。** 图表样式、配色、动画均可自由修改使用。\n- **路径与凭据请自行处理。** 示例中的 `<YOUR_PATH>` 和任何 Key 都不要原样贴进公开仓库。\n\n**能不能把一份数据说清楚，比能不能把一张图做漂亮重要得多。** 这句话我写在这里，也是提醒我自己。"},{"id":"ai-format-regex","type":"Python 排坑","icon":"🤖","title":"AI 说它会按格式输出，但它不会：我给考研分析套了一层正则","desc":"重点不是爬虫，也不是画报告。是那层「以为不用做、结果必须做」的校验 —— AI 的返回看着对，拿正则一卡就露馅。","tags":"AI, 正则, 数据管道, 校验","words":6339,"readMin":19,"content":"> 这篇的重点**不是爬虫**，也不是\"怎么画报告\"（那两件事别的文章写过了）。\n> 它只讲一件事：**当你把一个程序交给一个概率模型，你怎么保证它不把程序搞崩。**\n\n> **成本先说清（别白折腾）**：\n> - 爬虫部分 🟢 **零成本**，只要 `requests` + `pandas`\n> - AI 部分 🔴 **要一个讯飞星火 API Key**（实名注册，有免费额度），要花钱的我一律不放\n> - **没有 Key 也能跑**：把 `ai_fenxi()` 换成返回假数据的桩函数，爬虫、分档、HTML 报告整条链路照常走通，\n>   只是报告里\"AI 预测\"那一段显示\"暂无数据\"。**核心逻辑你一样能学到，不用先卡在申请 Key 上。**\n\n我决定考研是在 2026 年 9 月，那时候我手上什么数据都没有。目标院校是听说的，分数线是感觉的，专业课考什么是猜的。\n\n后来我把这件事拆成了三步：**先把数据爬下来，再让 AI 分析，最后生成一页能发给爸妈看的报告**。整条链路一共四个文件、1200 多行代码。\n\n这篇不讲\"怎么写爬虫\"，网上一搜一大把。我想讲的是**后半段**——数据爬回来之后，怎么让它变成一句人话，再变成一个能看的东西。\n\n### 第一步：87 行，两段接口\n\n考研网站的数据分两层：一层是**学校列表**，一层是**每个学校每个专业的分数线**。所以是两段接口串起来的。\n\n```python\nimport requests, time, random, pandas as pd\n\nsend_url = \"https://api.kaoyan.cn/pc/school/schoolList\"\nsend_h = {\n    \"user-agent\": \"Mozilla/5.0 ... Chrome/149.0.0.0 Safari/537.36\",\n    \"referer\": \"https://www.kaoyan.cn/\",\n}\nsend_data = {\"page\": 1, \"limit\": 20, \"province_id\": \"11\", \"type\": \"\", \"feature\": \"\", \"school_name\": \"\"}\nres = requests.post(url=send_url, headers=send_h, data=send_data)\nxxlist = res.json()[\"data\"][\"data\"]\n\nall_data = []\nfor xx in xxlist:\n    xname, xid = xx[\"school_name\"], xx[\"school_id\"]\n\n    for year in range(2023, 2027):\n        url = \"https://api.kaoyan.cn/pc/school/schoolScore\"\n        data = {\"degree_type\": \"\", \"school_id\": xid, \"year\": year}\n        resdata = requests.post(url=url, headers=send_h, data=data).json()\n\n        for x in resdata[\"data\"]:\n            all_data.append({\n                \"学校\": xname, \"专业\": x[\"name\"], \"代码\": x[\"code\"],\n                \"招生院系\": x[\"depart_name\"], \"总分\": x[\"total\"],\n                \"政治\": x[\"english\"], \"外语\": x[\"politics\"],\n                \"专业课一\": x[\"special_one\"], \"专业课二\": x[\"special_two\"],\n                \"录取年份\": x[\"year\"],\n            })\n\n    time.sleep(random.randint(1, 3))\n\npd.DataFrame(all_data).to_csv(\"各院校历年数据采集.csv\", index=False)\n```\n\n87 行里，真正值得说的只有三件事。\n\n**第一，学校 id 是链条的关节。** 第一个接口给你 `school_id`，第二个接口要你把这个 id 喂回去。所有\"列表页 → 详情页\"的爬虫都是这个结构，我以前写过音乐下载、B 站视频，一模一样。\n\n**第二，`random.randint(1, 3)` 不是可选项。** 一个学校 4 个年份 = 4 个请求，20 个学校就是 80 个请求。不加 sleep，一分钟内 IP 就凉了。\n\n**第三，注意 `政治` 和 `外语` 这两个字段。** 代码里写的是 `\"政治\": x[\"english\"], \"外语\": x[\"politics\"]`——**字段名是反的**。这不是我写错了，是接口本身就这么返回的（至少我抓的时候是）。所以我加了一层别名映射，把接口的脏数据挡在 CSV 外面。\n\n**数据脏是常态。** 我后来抽了 20 行出来看，还发现总分有空的、专业课二有 `\"-\"` 的。所以读取的时候必须 `try: float(...) except: continue`，不能假设字段一定是数字。\n\n### 第二步：把\"择校\"这件事翻译成代码\n\n这一步是我做这个项目时最爽的地方——**\"冲刺 / 稳妥 / 保底\"这三个词，是可以写成 if 的**。\n\n```python\nfor r in rows:\n    if zhuanye not in r['专业']:\n        continue\n    try:\n        xian = float(r['总分'])\n    except:\n        continue\n\n    info = r['学校'] + ' | ' + r['专业'] + ' | ' + str(int(xian)) + '分 | ' + r['录取年份'] + '年'\n    if xian > fenshu + 10:\n        chongci += '  ' + info + '\\n'\n    elif xian >= fenshu - 10:\n        wentuo += '  ' + info + '\\n'\n    else:\n        baodi += '  ' + info + '\\n'\n```\n\n`fenshu` 是我的估分，`±10` 是一个我自己定的带宽：\n\n- 比我高 10 分以上 → **冲**\n- 在 ±10 分之内 → **稳**\n- 比我低 10 分以上 → **保底**\n\n**这十行代码的价值，不在于技术，在于它把一个模糊的焦虑变成了一条条能排序的记录。**\n\n写之前我脑子里是\"我大概能考上哪儿\"，写之后我看到的是一张表：哪些学校的金融专业在 370 分附近，分别是哪一年、哪个院系。焦虑变成了清单，清单是可以处理的。\n\n### 第三步：让 AI 分析，然后**不信它**\n\n这一步是我踩坑最多的地方。\n\n我的提示词很朴素：把历史分数线、以及按 ±10 分筛出来的三档学校喂给它，要求 300 字以内、按固定格式输出。\n\n```python\nprompt += '请用以下格式输出（每项写简洁，不要展开）：\\n'\nprompt += '---\\n'\nprompt += '预测明年线：XX分（理由：一句话）\\n'\nprompt += '\\n'\nprompt += '冲刺推荐：2个（学校-专业，分数线，理由一句话）\\n'\nprompt += '稳妥推荐：2个（同上）\\n'\nprompt += '保底推荐：2个（同上）\\n'\nprompt += '\\n'\nprompt += '建议：1条\\n'\n```\n\n第一版跑出来，AI 确实给了答案，但格式每次都不一样：有时是 `冲刺推荐：`，有时是 `**冲刺推荐**:`，有时干脆换成小标题。**我的程序按 `冲刺推荐：` 去切，一半的时候切不到。**\n\n我当时的错误想法是：\"提示词再写严一点它就会守规矩。\"\n\n不会的。**LLM 是概率模型，不是编译器。** 你把格式写进提示词，只是让它\"倾向于\"这么输出，不是保证。\n\n所以第二版我改了思路：**解析端不要求格式正确，只要能在噪声里把需要的东西捞出来。**\n\n```python\npatterns = {\n    'prediction': r'预测\\s*(?:明年|\\d{4})\\s*线\\s*[：:]\\s*(.+?)(?=\\n\\s*(?:冲刺|稳妥|保底|建议|\\Z))',\n    'chongci':     r'冲刺推荐\\s*[：:]\\s*(.+?)(?=\\n\\s*(?:稳妥|保底|建议|\\Z))',\n    'wentuo':      r'稳妥推荐\\s*[：:]\\s*(.+?)(?=\\n\\s*(?:保底|建议|\\Z))',\n    'baodi':       r'保底推荐\\s*[：:]\\s*(.+?)(?=\\n\\s*(?:建议|\\Z))',\n    'advice':      r'建议\\s*[：:]\\s*(.+?)$',\n}\nfor key, pattern in patterns.items():\n    m = re.search(pattern, clean, re.DOTALL | re.MULTILINE)\n    if m:\n        sections[key] = m.group(1).strip()\n```\n\n三个关键点，全在这一小段里：\n\n- **`[：:]` 全角半角都收**，因为 AI 经常混着输出。\n- **`\\s*` 到处都是**，容忍多余空格和换行。\n- **`(?=...)` 前瞻**，用来\"切到下一个标题为止\"。这是 `.+?` 非贪婪做不到的——非贪婪只保证最短，不保证停在正确的边界上。\n\n**如果我还是解析不出来怎么办？** 每一项默认是空字符串，`build_xxx_html()` 里判空就给\"暂无数据\"。**整个程序不会崩，只会降级。**\n\n这就是我对\"AI 集成\"的全部理解：**它的输出永远当作不可靠的外部输入处理，跟处理一个第三方 API 一样。**\n\n### 第四步：把结果变成一个能看的东西\n\n数据干净了，怎么展示？有三个选择：命令行打印、生成 PDF、生成 HTML。\n\n我选 HTML，理由是**单文件、双击就开、能发微信**。\n\n```python\nhtml = HTML_TEMPLATE\nhtml = html.replace('{school}', school)\nhtml = html.replace('{major}', major)\nhtml = html.replace('{score}', str(int(score)))\nhtml = html.replace('{prediction_html}', build_prediction_html(sections))\nhtml = html.replace('{history_html}', build_history_html(data['linian']))\n```\n\n**为什么不用 jinja2？** 因为要装依赖，而且模板文件得单独存一份，分发的时候容易漏。\n\n`str.replace` 是土办法，但它有一个巨大的好处：**整个报告就是一个 .py 文件里的一个字符串常量，复制走就能跑**。我给同学看过一次，他要做的就是改三个变量。\n\n代价是模板里不能用 `{` `}`（会被误替换）。所以我 CSS 里全用 `--var: value;` 这种写法，避开花括号冲突。这个坑我在做可视化大屏的时候又踩了一次，后面那篇会专门写。\n\n### 第五步：最后一行代码，决定用户会不会用\n\n```python\nhtml_path = os.path.abspath('./考研数据分析报告.html')\nwith open(html_path, 'w', encoding='utf-8') as f:\n    f.write(html_content)\nwebbrowser.open('file://' + html_path)\n```\n\n`webbrowser.open()` 只有一行，但它是整个项目里性价比最高的一行。\n\n没有它：用户跑完程序，看到\"报告已生成：C:\\Users\\...\\考研数据分析报告.html\"，然后手动去文件夹里找。\n\n有了它：跑完，浏览器自己弹出来。\n\n**技术项目好不好用，常常不取决于核心逻辑，取决于这最后一步有没有替用户点一下。**\n\n### 写在最后\n\n回头看这个项目，1200 行代码里，我觉得有价值的东西按顺序是：\n\n1. **把模糊的焦虑翻译成可以排序的数据**（±10 分那条 if）\n2. **永远不信 LLM 的格式承诺**（正则兜底 + 降级不崩）\n3. **让最后一步自己发生**（`webbrowser.open`）\n\n至于爬虫那 87 行——说实话，那部分谁都能写。\n\n下一步我打算做三件事：把 CSV 换成 SQLite（数据量到几万行时 `pd.read_csv` 明显变慢）、把提示词和格式解析抽成独立的 `llm_parse.py`（现在混在业务里太脏）、让报告支持多校对比（现在一次只能看一所）。\n\n**这套\"爬数据 → 算指标 → 问 AI → 出报告\"的流水线，换个领域就能复用。** 我下一步想用它做\"实习岗位薪资地图\"，逻辑几乎不用改，只换数据源和指标。\n\n### 免责声明（请务必读完）\n\n- **数据仅供个人参考，不构成任何报考建议。** 分数线受招生计划、报考人数、试题难度影响，历史数据不能线性外推。**最终以目标院校研究生院官网发布的招生简章和复试线为准。**\n- **请控制抓取频率。** 本文代码里的 `sleep(random.randint(1, 3))` 不是装饰。高频请求会给对方服务器造成压力，也可能导致你的 IP 被封。《网络安全法》对\"干扰他人网络正常功能\"有明确约束。\n- **不要把爬来的数据商业化。** 二次分发、售卖、用于商业产品，可能侵犯数据权益。\n- **AI 输出的内容可能是错的。** 本文里 AI 的\"预测明年线\"只是基于历史数字的模式外推，**它不懂招生政策，也不知道今年会不会扩招**。请把它当成一个帮你整理信息的助手，不是决策者。\n- **凭据不要写进代码。** 本文示例里的 API Key 通过 `get_credential()` 从环境变量读取，**任何公开仓库、博客、截图里都不要贴真实 Key**。\n- **本文代码可能随时失效。** 接口地址、字段名、页面结构都会变。以你手上的实际情况为准，运行后果自负。\n\n**择校这件事，数据和 AI 都只能帮到\"把选项列清楚\"这一步。真正决定的那一下，还是得你自己下。**"},{"id":"reverse-flood-fill","type":"算法模板","icon":"🧩","title":"从边界反向灌：一个模板通吃\"能不能通到外面\"这类题","desc":"有一类题长得各不相同，内核只有一个：问某个东西能不能通到外面。把起点从「内部」换成「边界」，模板就通用了。","tags":"算法, BFS, 模板, 蓝桥杯","words":4042,"readMin":12,"content":"有一类题长得各不相同，但内核只有一个：**问某个东西能不能通到外面。**\n\n被围住的区域、被围绕的岛屿、能流出去的雨水、能不能到达边界……题面变来变去，解法却是同一个。\n\n这个模板我在一道题上白花了两小时才想通。所以这篇不写\"我怎么卡的\"，只写**你现在就能抄走的东西**。\n\n### 第一步：先认题（这张表比代码重要）\n\n看到下面这些说法，别急着遍历每一个格子：\n\n| 题面里出现 | 你要做的 |\n|---|---|\n| \"被围住\" / \"被围绕\" | 从边界反向灌 |\n| \"能不能通到外面\" / \"会不会漏出去\" | 从边界反向灌 |\n| \"能不能到达边界\" / \"能不能逃出去\" | 从边界反向灌 |\n| \"封闭区域\" / \"内湖\" / \"死水\" | 从边界反向灌 |\n| \"边缘的 X 影响内部的 Y\" | 从边界反向灌 |\n\n反过来，如果题面是\"**这块区域的面积**\"\"**有几个不相连的块**\"，那是正向 DFS/BFS，`for` 遍历每个格子 + 标记，别搞混。\n\n**判据只有一条：题目问的是\"内部的性质\"，还是\"外部能不能进来/出去\"。**\n\n### 第二步：模板（可直接抄）\n\n场景：`n×m` 的格子，`1` 是陆地，`0` 是水。问有多少格水漏不出去。\n\n```python\nimport sys\n\ndef solve(n, m, grid):\n    seen = [[False] * m for _ in range(n)]\n    sys.setrecursionlimit(n * m + 1000)      # ← 下面第三个坑专门讲\n\n    def dfs(x, y):\n        if x < 0 or x >= n or y < 0 or y >= m:   # ← 越界判断必须在前\n            return\n        if seen[x][y] or grid[x][y] == 1:        # 已访问 / 是陆地\n            return\n        seen[x][y] = True\n        dfs(x + 1, y); dfs(x - 1, y); dfs(x, y + 1); dfs(x, y - 1)\n\n    # ① 只从四条边界上\"是水\"的格子出发\n    for i in range(n):\n        if grid[i][0] == 0:       dfs(i, 0)\n        if grid[i][m - 1] == 0:   dfs(i, m - 1)\n    for j in range(m):\n        if grid[0][j] == 0:       dfs(0, j)\n        if grid[n - 1][j] == 0:   dfs(n - 1, j)\n\n    # ② 没被灌到 + 是水 = 漏不出去的\n    ans = 0\n    for i in range(n):\n        for j in range(m):\n            if grid[i][j] == 0 and not seen[i][j]:\n                ans += 1\n    return ans\n```\n\n**整个模板只有两个动作：边界起手灌一遍，再扫一遍没被灌到的。**\n\n### 为什么反过来就变简单了\n\n因为**\"漏得出去\"这件事有出口，\"漏不出去\"没有。**\n\n正向做（从每块水出发去检查它碰不碰边）会遇到一个很别扭的问题：一片水可能有几百格，你怎么把\"我这一支碰到边了\"这个信息带回到整片的判断上？\n\n反向做，这个问题直接消失——**你不判断\"漏不漏\"，你判断\"到不到得了\"。** 到得了的就是漏得出去的，剩下的一律是被围住的。\n\n**\"有明确起点的事情，从起点做；没有起点的事情，从出口反推。\"** 这句话适用于所有这类题。\n\n### 三个必踩的坑\n\n**坑一：`sys.setrecursionlimit` 不能写死。**\n\n200×200 全连通的水，最长一条递归路径 **39106 层**。Python 默认 1000 层，直接 `RecursionError`。\n\n我第一次设了 `10000`——因为之前做过一道 60×60 的，10000 够用。**这次照样崩。**\n\n一格就是一层，最坏路径约等于格子数，所以：\n\n```python\nsys.setrecursionlimit(n * m + 1000)\n```\n\n**跟着规模走，别记具体数字。** 记数字的人一定会再崩一次。\n\n**坑二：越界判断必须写在 `seen[x][y]` 前面。**\n\n```python\nif x < 0 or x >= n or y < 0 or y >= m:   # 先判\n    return\nif seen[x][y] ...:                        # 再查表\n```\n\n顺序反了会怎样？`seen[-1]` 在 Python 里**不报错**，它取的是最后一行。于是你静默地算错，而且极难查出来。这类\"合法但语义错\"的下标，是刷题里最阴的一种 bug。\n\n**坑三：`dfs` 写好了，记得真的调用它。**\n\n这听起来蠢，但我干过：`dfs` 定义了四十行，主循环里只有 `ans += 1`，一次都没调。程序不报错，输出还挺像回事。\n\n**自查方法**：在 `dfs` 第一行加一句打印，跑一次看它到底跑没跑。跑完删掉。这个习惯救过我两次。\n\n### 怎么确认你真的写对了\n\n**样例过什么都证明不了。** 这是我在这道题上学到的最贵的一课。\n\n那道题我第一版算的是\"所有水格\"，样例恰好给了 `6`（因为样例里的水刚好全被围住），我看输出对就收工了。直到我拿一张\"内部 39204 格水全部连到外面\"的图去测——正确答案 `0`，我输出 `39205`。\n\n**所以验一套解法，用这三种方式：**\n\n**① 专门准备一张\"能杀掉错思路\"的图。**\n上面那张就是。任何\"数水格\"的写法在它上面必然暴毙。**每个模板都该配一张这样的图。**\n\n**② 随机对拍。**\n写一个 BFS 迭代版当标准答案，随机生成小图（1×1 到 8×8，四种水陆比例），两边逐个比对：\n\n```python\nimport random\n\ndef random_case(max_n=8):\n    n, m = random.randint(1, max_n), random.randint(1, max_n)\n    p = random.choice([0.2, 0.4, 0.6, 0.8])          # 陆地比例\n    grid = [[1 if random.random() < p else 0 for _ in range(m)] for _ in range(n)]\n    return n, m, grid\n\nbad = 0\nfor _ in range(3000):\n    n, m, g = random_case()\n    if solve(n, m, g) != bfs_reference(n, m, g):\n        bad += 1\nprint(\"不一致:\", bad)      # 我这边跑出来是 0\n```\n\n我的记录是 **3000 组，0 组不一致**。这比\"样例过了\"可信一万倍。\n\n**③ 边界单项。** 1×1 全水、1×1 全陆、1×5、5×1、贴边水、单格湖——六个手写的极端情况。\n\n**三种都过，才叫\"我找不到让它错的办法了\"。**\n\n### 三道同类题\n\n认熟了模板，这三道可以连着做：\n\n- **LeetCode 130 · 被围绕的区域**——最标准的一道，把 `O` 里被 `X` 围住的那部分翻成 `X`，反向灌的教科书案例\n- **LeetCode 417 · 太平洋大西洋水流问题**——从两个洋的边界分别反向灌一次，两次都被灌到的格子就是答案\n- **LeetCode 1254 · 统计封闭岛屿的数目**——和本文场景几乎一样，只是要数\"块数\"不是\"格数\"\n\n**417 那道特别能说明问题**：正向做要想\"这一格能不能同时到两个洋\"，反向做只是\"灌两遍取交集\"。**同一个模板，套两次。**\n\n### 写在最后\n\n这类题的模板只有二十行，但真正值钱的是那句判据：\n\n> **题目问的是\"内部的性质\"，还是\"外部能不能进来/出去\"？**\n\n问外部，就反向灌。问内部，就正向遍历。**先分这一刀，比先写代码重要。**\n\n顺便记一个性能数：最坏情况（200×200 全连通、递归 39106 层）跑完 **0.591 秒**。递归深度已经贴着极限了，如果规模再大，**别加 recursionlimit，改成 BFS 用队列**——迭代不会栈溢出。\n\n**成本：🟢 零成本零注册。** 只要有 Python，`import sys` 都不用装任何第三方库，复制粘贴就能跑。这是我特意选的——刷题不该先卡在环境上。\n\n### 免责声明\n\n- 本文代码为算法学习示例，题目与数据均为自制，**不涉及任何商业题库**。\n- 文中提到的 LeetCode 题号仅供思路对照，题面与测试用例以官网为准。\n- `sys.setrecursionlimit` 调大可能导致**栈溢出崩溃**（不是抛异常，是进程直接挂）。生产环境处理大网格请优先用 BFS 迭代。\n- 时间复杂度 O(n·m)、空间复杂度 O(n·m)，本文未做空间优化；数据规模极大时请自行评估。"},{"id":"pyecharts-four","type":"数据可视化","icon":"📈","title":"一份爬虫数据,凭什么变成四个图表?pyecharts 可视化全流程拆解","desc":"手上已经有一份 CSV，别急着打开 Excel 慢慢筛 —— 几十行 Python 就能跑出一整套交互式图表，还能塞进一个 HTML 里发出去。","tags":"pyecharts, pandas, 可视化, 全流程","words":8270,"readMin":25,"content":"如果你手上已经有一份\"各院校历年数据采集.csv\",别急着打开 Excel 慢慢筛——用 Python 写几十行,就能跑出一整套交互式图表,还能塞进一个 HTML 里发出去。\n\n这篇文章就拿一个真实的脚本(我把它叫 `可视化绘图.py`)做例子,把从读 CSV 到出图的整条链路拆给你看。读完你应该能自己照着这套模板,套到任何一份带\"学校、专业、分数、年份\"这类字段的数据上。\n\n### 先给你看一眼脚本长什么样\n\n下面就是这次要拆解的代码,不到 140 行,包含四张图和最后的组合页面:\n\n```python\n# Bar柱形图,Line线形图,Pie饼状图,\nfrom pyecharts.charts import Bar, Line, Pie, Page\nimport pandas\n# options:pyecharts的配置模块,用于设置标题、坐标轴、标签等图表样式\nfrom pyecharts import options as opts\n\n\"\"\"\n读取数据并清洗\n\"\"\"\n# 读取CSV数据文件\n# read_csv:读取CSV文件,将表格数据转换为DataFrame对象\n# DataFrame:pandas核心数据结构,用于保存二维表格数据\ndf = pandas.read_csv(\"各院校历年数据采集.csv\")\n\n# 删除总分缺失的数据,避免无效数据影响后续统计\nnewdf = df[df[\"总分\"] != \"--\"]\n# 筛选2023年的招生数据,让所有图表保持同一年份的数据口径\nnewdf = newdf[newdf[\"录取年份\"] == 2023]\n# 将总分字段转换成整数类型,方便后续进行最大值、平均值等计算\nnewdf[\"总分\"] = newdf[\"总分\"].astype(int)\n\n\"\"\"\n图1:招生人数排行TOP10学校\n分析目的:查看哪些学校招生规模最大。\n\"\"\"\nschool_count = newdf.groupby(\"学校\").size().sort_values(ascending=False).head(10).reset_index(name=\"招生人数\")\nschool_x = school_count[\"学校\"].tolist()\nschool_y = school_count[\"招生人数\"].tolist()\n\nbar = Bar()\nbar.add_xaxis(school_x)\nbar.add_yaxis(\"招生人数\", school_y, color_by=\"data\")\nbar.set_global_opts(\n    title_opts=opts.TitleOpts(title=\"招生人数Top10\"),\n    xaxis_opts=opts.AxisOpts(axislabel_opts={\"rotate\": 30}),\n)\n\n\"\"\"\n图2:金融专业各学校分数线\n分析目的:比较不同学校金融专业录取分数差异。\n\"\"\"\nmajor = newdf[newdf[\"专业\"] == \"金融\"]\nmajorschool = major.groupby(\"学校\").agg(最低分数=(\"总分\", \"min\"), 最高分数=(\"总分\", \"max\")).reset_index()\nresultdata = majorschool.sort_values(by=\"最低分数\").head(10)\nline_x = resultdata[\"学校\"].tolist()\nline_y = resultdata[\"最低分数\"].tolist()\n\nline = Line()\nline.add_xaxis(line_x)\nline.add_yaxis(\"金融专业最低分\", line_y)\nline.set_global_opts(\n    title_opts=opts.TitleOpts(title=\"各学校金融专业分数线\"),\n    xaxis_opts=opts.AxisOpts(axislabel_opts={\"rotate\": 30}),\n)\nline.render(\"金融专业最低分.html\")\n\n\"\"\"\n图3:专业招生数量占比\n分析目的:观察哪些专业数据量最多。\n\"\"\"\nzycount = newdf.groupby(\"专业\").size().sort_values(ascending=False).head(10).reset_index(name=\"数量\")\npie_data = list(zip(zycount[\"专业\"].tolist(), zycount[\"数量\"].tolist()))\n\npie = Pie()\npie.add(\"专业数量\", pie_data)\npie.set_series_opts(label_opts=opts.LabelOpts(formatter=\"{b}:{c} ({d}%)\"))\npie.render(\"专业招生数量占比.html\")\n\n\"\"\"\n图4:专业招生数量+平均分组合图\n分析目的:同时分析专业招生规模和录取难度。\n柱状图:表示招生数量\n折线图:表示平均录取分\n\"\"\"\nzy_data = newdf.groupby(\"专业\").agg(\n    招生数量=(\"专业\", \"count\"),\n    平均分=(\"总分\", \"mean\"),\n).sort_values(by=\"招生数量\", ascending=False).head(10).reset_index()\nzy_data[\"平均分\"] = zy_data[\"平均分\"].round(1)\nmix_x = zy_data[\"专业\"].tolist()\ncount_y = zy_data[\"招生数量\"].tolist()\navg_y = zy_data[\"平均分\"].tolist()\n\nmix_bar = Bar()\nmix_bar.add_xaxis(mix_x)\nmix_bar.add_yaxis(\"招生数量\", count_y)\n\nmix_line = Line()\nmix_line.add_xaxis(mix_x)\nmix_line.add_yaxis(\"平均分\", avg_y)\nmix_bar.set_global_opts(\n    title_opts=opts.TitleOpts(title=\"专业招生数量与平均分分析\"),\n    xaxis_opts=opts.AxisOpts(axislabel_opts={\"rotate\": 30}),\n)\n# 要让两个图形都显示出来,基本都使用一个x轴\nmix_bar.overlap(mix_line)\nmix_bar.render(\"专业招生数量与平均分分析.html\")\n\n# 把所有的图放在一个网址中\npage = Page(layout=Page.SimplePageLayout)\npage.add(bar, line, pie, mix_bar)\npage.render(\"综合考研数据可视化分析图表.html\")\n```\n\n整段脚本的思路是**先清洗、再分图、最后合成一个页面**。下面按这三步拆开讲。\n\n### 为什么选 pyecharts,而不是 matplotlib\n\n很多人入门可视化用的是 matplotlib,但它有个硬伤:**默认输出是静态图片**。你要做报告、塞进 PPT 没问题,要做\"鼠标悬停看数值\"\"点击图例隐藏某条线\"这种交互,得自己写事件。\n\npyecharts 直接基于 ECharts,默认输出就是 HTML,自带交互。每个图表对象三步走:**add_xaxis → add_yaxis → set_global_opts**,写法非常套路化,熟悉一个 Bar 之后,Line、Pie 基本一通百通。\n\n这也是为什么这份代码看起来\"复制粘贴感很强\"——因为它就是模板化的。每张图都是同样的三步,你只要换数据就行。\n\n### 第一步:数据清洗,这步别偷懒\n\n数据可视化里有一句老话:**垃圾进,垃圾出**。原始爬下来的 CSV 通常都有空值、占位符、字符串数字这些坑,代码里这一段是真正决定图表质量的:\n\n```python\ndf = pandas.read_csv(\"各院校历年数据采集.csv\")\n\n# 删除总分缺失的数据,避免无效数据影响后续统计\nnewdf = df[df[\"总分\"] != \"--\"]\n# 筛选2023年的招生数据,让所有图表保持同一年份的数据口径\nnewdf = newdf[newdf[\"录取年份\"] == 2023]\n# 将总分字段转换成整数类型,方便后续进行最大值、平均值等计算\nnewdf[\"总分\"] = newdf[\"总分\"].astype(int)\n```\n\n三件事:\n\n1. **去无效值**:爬虫经常会把没录取的、或者没填分的记录写成 `--`。如果不剔除,后面 `astype(int)` 会直接报错。\n2. **统一时间口径**:如果你要做\"今年 vs 去年\"的对比,千万别把所有年份混在一张图里。这份脚本只取 2023,所以四张图都是同一年的横截面。\n3. **类型转换**:CSV 读出来默认全是字符串,`groupby` + `mean` 算出来也会是字符串,画图工具一脸懵。手动 `astype(int)` 是最稳的姿势。\n\n这一段如果省了,后面四张图全得返工。\n\n### 第二步:四张图,四种看数据的姿势\n\n#### 图 1:Bar——看\"哪所学校招生最多\"\n\n```python\nschool_count = newdf.groupby(\"学校\").size().sort_values(ascending=False).head(10).reset_index(name=\"招生人数\")\nbar = Bar()\nbar.add_xaxis(school_count[\"学校\"].tolist())\nbar.add_yaxis(\"招生人数\", school_count[\"招生人数\"].tolist(), color_by=\"data\")\n```\n\n`groupby(\"学校\").size()` 数每个学校有几条记录,这就是\"招生人数\"的最朴素定义——不一定准,但跑得通。`color_by=\"data\"` 是 pyecharts 1.x 的一个彩蛋,它会让每根柱子自动按数值分配颜色,比统一一个蓝要好看。\n\nX 轴用了 `axislabel_opts={\"rotate\": 30}`,把学校名字旋转 30 度,避免长名字互相挤压。这是几乎所有横轴是文字的图都必须做的小动作。\n\n#### 图 2:Line——看\"金融专业各校分数\"\n\n```python\nmajor = newdf[newdf[\"专业\"] == \"金融\"]\nmajorschool = major.groupby(\"学校\").agg(\n    最低分数=(\"总分\", \"min\"),\n    最高分数=(\"总分\", \"max\"),\n).reset_index()\n```\n\n`.agg(...)` 是 pandas 的\"分组聚合\",一次性算出每个学校的最低分和最高分。代码里只画了最低分,但保留了最高分字段——后续你想加一条折线,直接 `add_yaxis(\"最高分数\", ...)` 就行,不用再算一遍。\n\n注意这个图有个**隐藏坑**:它按最低分升序排序,意味着 X 轴上的学校是从\"最容易考的\"到\"比较难考的\"。如果你想表达\"哪个学校最难考\",应该按最低分降序,X 轴反过来更顺眼。这种排序轴的设计,直接决定别人看图的结论。\n\n#### 图 3:Pie——看\"专业分布\"\n\n```python\npie_data = list(zip(zycount[\"专业\"].tolist(), zycount[\"数量\"].tolist()))\npie = Pie()\npie.add(\"专业数量\", pie_data)\npie.set_series_opts(label_opts=opts.LabelOpts(formatter=\"{b}:{c} ({d}%)\"))\n```\n\n饼图的数据格式比较特殊,要的是 `[(名字, 数值), (名字, 数值), ...]` 这种二元组列表,所以用了 `zip` 把两列拼起来,再 `list` 转一下。pyecharts 1.9+ 也支持 `[(\"名字\", 数值), ...]` 直接传,跟这里是等价的。\n\n`formatter=\"{b}:{c} ({d}%)\"` 是标签模板——`{b}` 是名字、`{c}` 是数值、`{d}` 是百分比。这样每一片扇区里同时显示\"专业名:数量(占比%)\",比单独显示一个百分比要信息密度高得多。\n\n饼图有一个天然限制:**超过 7-8 个分类就读不下去了**。所以代码先用 `head(10)` 截了 Top 10,然后建议展示的时候只留 Top 5-7,剩下的折叠成\"其他\"。\n\n#### 图 4:Bar + Line——双 Y 轴的看家本领\n\n```python\nmix_bar = Bar()\nmix_bar.add_xaxis(mix_x)\nmix_bar.add_yaxis(\"招生数量\", count_y)\n\nmix_line = Line()\nmix_line.add_xaxis(mix_x)\nmix_line.add_yaxis(\"平均分\", avg_y)\n\nmix_bar.overlap(mix_line)\n```\n\n这是 pyecharts 里非常骚的一招:**两个 Chart 对象共享同一个 X 轴**。柱状图表示数量,折线图表示分数,共用 X 轴就能在一张图里同时看到\"招生多不多 + 难不难考\"。\n\n实现的关键是最后那行 `mix_bar.overlap(mix_line)`——这玩意儿在文档里名字叫\"层叠多图\",实际上就是把折线叠加到柱状图上。注意调用者是 `mix_bar`,不是 `Page`,别写错。\n\n如果两个 Y 轴数量级差太大(比如一个 0-100、一个 0-10000),记得给 `mix_line` 加 `yaxis_index=1`,否则折线会被柱状压成一条贴地的线。\n\n### 第三步:Page 把四张图打包成一个网页\n\n```python\npage = Page(layout=Page.SimplePageLayout)\npage.add(bar, line, pie, mix_bar)\npage.render(\"综合考研数据可视化分析图表.html\")\n```\n\n`Page` 是 pyecharts 的\"图表容器\",你可以理解成 HTML 里的 `<div>` 集合。`SimplePageLayout` 是最简单的纵向排列——图 1 在上、图 2 在下,依次堆。\n\n`render()` 出来的是一个完整 HTML 文件,直接双击用浏览器打开就能交互。**这就是为什么 pyecharts 适合做报告**:发一个 HTML 给同事,对方鼠标移上去就能看数值,不用装 Python 也不用装 Jupyter。\n\n如果你想要更花哨的排版,`Page` 还支持 `DraggablePageLayout`(拖拽布局)、`SimplePageLayout`(纵向)、自定义 JS 模板。但新手先用 `SimplePageLayout` 就够,排版太花反而会喧宾夺主。\n\n### 几个我踩过的坑,顺便送给你\n\n**坑 1**:中文乱码。pyecharts 默认字体不支持中文,出来的图全是方框。解决方法是在每个 `set_global_opts` 里加 `title_opts=opts.TitleOpts(title=\"...\", title_textstyle_opts=opts.TextStyleOpts(font_family=\"Microsoft YaHei\"))`。这份脚本里没显式设,但本地装了中文字体所以没事;线上环境记得处理。\n\n**坑 2**:`render()` 不指定路径默认输出当前目录,文件名就是参数。`line.render(\"金融专业最低分.html\")` 会在你运行脚本的目录下生成 HTML——所以一定要用 IDE 的\"运行\"或者 `cd` 到正确目录再跑,不然文件不知道跑哪儿去了。\n\n**坑 3**:`groupby().agg()` 的列名如果带中文,要确认 CSV 真的是 UTF-8 编码。Windows 上 Excel 默认存的是 GBK,如果 CSV 是另存为出来的,读出来会全是乱码。`pandas.read_csv` 加 `encoding=\"gbk\"` 或者 `encoding=\"utf-8-sig\"`(带 BOM 的)就能解决。\n\n### 适合谁用、怎么扩展\n\n这套模板最大的好处是**结构非常对称**——每张图都是 \"清洗 → 聚合 → 三步画图\"。所以你只要做三件事就能扩展:\n\n1. 换数据源:把 `pandas.read_csv(...)` 换成读 MySQL、读 Excel、读 API。\n2. 加新图:复制任意一段图,改 X 轴列、改 Y 轴聚合函数,完事。\n3. 加新维度:比如再加一个\"按省份聚合\"的图,只要数据里有省份字段,一行 `groupby(\"省份\")` 就接上了。\n\n想做一个考研数据看板、自媒体粉丝数据看板、销售数据看板,套路完全一样。\n\n### 写在最后\n\n可视化这件事,**80% 的时间花在清洗数据,20% 才是画图**。这篇拆解的脚本里,清洗只占 7 行,但没有这 7 行,后面 130 行全白搭。\n\n下次你再看到一份\"看着挺复杂\"的 pyecharts 代码,把它当成三步看:**数据清洗 → 每张图三件套(add_xaxis/add_yaxis/set_global_opts)→ Page 打包**。基本就能一眼读懂。\n\nthat said,可视化不是越花越好。能让别人 5 秒看懂你想说什么,比做出 8 种炫酷图表更重要。\n\n---\n\n## ⚠️ 免责声明\n\n**本代码及本文内容仅用于 Python 数据可视化(pyecharts + pandas)的学习与技术交流目的。**\n\n- **数据来源合法性**:本示例所用 `各院校历年数据采集.csv` 应为你**已获得合法授权或属于公开数据**的来源。请勿使用本代码分析、处理或传播任何未经授权采集的个人隐私数据、商业机密数据,或违反《数据安全法》《个人信息保护法》等法律法规的数据。\n- **爬虫行为合规性**:本文配套的爬虫脚本(如 B 站、淘宝、小红书等)若涉及抓取第三方平台数据,请严格遵守目标站点的 `robots.txt`、用户协议及 API 调用规范,不得绕过反爬措施、不得高频请求造成对方服务器负载,所有抓取行为须在授权范围内进行。\n- **代码使用风险**:本代码示例未经过完整生产环境测试,作者不对因直接复制使用本代码而产生的任何数据丢失、服务异常、法律纠纷或经济损失承担责任。请在自有环境中充分测试后再用于实际项目。\n- **图表结论免责**:本文中的图表示例仅用于演示 pyecharts 的可视化能力,**不代表任何对院校、专业或录取难度的真实评价**。实际报考请以院校官方招生简章、教育部阳光高考平台及当年招生目录为准。\n- **第三方依赖**:pyecharts、pandas 等库的版本差异可能导致部分 API 行为不同,本文示例基于 pyecharts 1.x / pandas 1.x 编写,使用其他版本时请参考对应官方文档。\n\n**如你将本代码用于商业项目或公开发布,务必自行评估合规风险与数据准确性。**\n\n---\n\n> 写于 2026 年 9 月 · 配图来源:由 `可视化绘图.py` 实际运行生成的四张 ECharts 图表。"}];

// ═══════════════ STATE ═══════════════
let currentView = 'gallery';
let currentTemplateId = null;
let tags = [];
let focusMode = false;
let saveTimer = null;

// ═══════════════ GALLERY ═══════════════
function renderGallery() {
  document.getElementById('grid').innerHTML = TEMPLATES.map(t => `
    <div class="card" onclick="openTemplate('${t.id}')">
      <div class="card-meta"><span class="card-type-icon">${t.icon}</span>${t.type}</div>
      <h3>${t.title}</h3>
      <p class="card-desc">${t.desc}</p>
      <div class="card-bottom">
        <span>${t.words.toLocaleString()} 字 · ${t.readMin} 分钟阅读</span>
        <span class="hint">打开 →</span>
      </div>
    </div>
  `).join('');
}

// ═══════════════ VIEW SWITCHING ═══════════════
function showGallery() {
  currentView = 'gallery';
  currentTemplateId = null;
  document.getElementById('galleryView').style.display = 'block';
  document.getElementById('editorView').style.display = 'none';
  document.getElementById('navSep').style.display = 'none';
  document.getElementById('navCur').textContent = '';
  renderHeaderActions();
}

function showEditor() {
  currentView = 'editor';
  document.getElementById('galleryView').style.display = 'none';
  document.getElementById('editorView').style.display = 'block';
  document.getElementById('navSep').style.display = '';
  updateNav();
  renderHeaderActions();
}

function updateNav() {
  const el = document.getElementById('navCur');
  if (currentTemplateId) {
    const t = TEMPLATES.find(x => x.id === currentTemplateId);
    el.textContent = t ? t.title : '自由写作';
  } else {
    el.textContent = '自由写作';
  }
}

function renderHeaderActions() {
  const c = document.getElementById('headerActions');
  if (currentView === 'gallery') {
    c.innerHTML = '<button class="btn btn-outline btn-sm" onclick="startBlank()">从空白开始</button>';
  } else {
    c.innerHTML = `
      <button class="btn btn-outline btn-sm" onclick="showGallery()">模板库</button>
      <button class="btn btn-outline btn-sm" onclick="clearEditor()">清空</button>
      <button class="btn btn-primary btn-sm" onclick="copyMarkdown()">复制 Markdown</button>
      <button class="btn btn-outline btn-sm" onclick="copyRichHTML()">复制富文本</button>
      <button class="btn btn-outline btn-sm" onclick="exportHTML()">导出 HTML</button>
    `;
  }
}

// ═══════════════ LOAD TEMPLATE ═══════════════
function openTemplate(id) {
  const t = TEMPLATES.find(x => x.id === id);
  if (!t) return;
  currentTemplateId = id;
  document.getElementById('titleInput').value = t.title;
  document.getElementById('editor').value = t.content;
  tags = t.tags.split(',').map(s => s.trim()).filter(Boolean);
  renderTags();
  showEditor();
  refreshPreview();
  updateOutline();
  showToast('模板已加载');
}

function startBlank() {
  currentTemplateId = null;
  document.getElementById('titleInput').value = '';
  document.getElementById('editor').value = '';
  tags = [];
  renderTags();
  showEditor();
  refreshPreview();
  updateOutline();
}

function clearEditor() {
  if (!confirm('确定要清空所有内容吗？')) return;
  currentTemplateId = null;
  document.getElementById('titleInput').value = '';
  document.getElementById('editor').value = '';
  tags = [];
  renderTags();
  refreshPreview();
  updateOutline();
  localStorage.removeItem('draft');
  showToast('已清空');
}

// ═══════════════ TAG CHIPS ═══════════════
function renderTags() {
  const container = document.getElementById('tagChips');
  container.innerHTML = tags.map((t, i) =>
    `<span class="tag-chip">${esc(t)}<span class="tag-x" onclick="rmTag(${i})">&times;</span></span>`
  ).join('') + '<input type="text" id="tagInputInline" placeholder="回车添加标签…" onkeydown="handleTagKey(event)" onblur="commitTag()">';
}

function handleTagKey(e) {
  if (e.key === 'Enter') { e.preventDefault(); commitTag(); }
  if (e.key === 'Backspace' && e.target.value === '' && tags.length > 0) {
    tags.pop(); renderTags(); onEditorChange();
  }
}

function commitTag() {
  const inp = document.getElementById('tagInputInline');
  if (!inp) return;
  const v = inp.value.trim();
  if (v && !tags.includes(v)) { tags.push(v); onEditorChange(); }
  renderTags();
}

function rmTag(i) { tags.splice(i, 1); renderTags(); onEditorChange(); }

// ═══════════════ TOOLBAR INSERTIONS ═══════════════
function insertMD(before, after, placeholder) {
  const ta = document.getElementById('editor');
  const s = ta.selectionStart, e = ta.selectionEnd;
  const sel = ta.value.substring(s, e);
  ta.value = ta.value.substring(0, s) + before + (sel || placeholder) + after + ta.value.substring(e);
  ta.focus();
  if (!sel) ta.setSelectionRange(s + before.length, s + before.length + placeholder.length);
  else ta.setSelectionRange(s + before.length + sel.length + after.length, s + before.length + sel.length + after.length);
  onEditorChange();
}

function insertHeading(level) {
  const ta = document.getElementById('editor');
  const s = ta.selectionStart;
  const ls = ta.value.lastIndexOf('\n', s - 1) + 1;
  const prefix = '#'.repeat(level) + ' ';
  ta.value = ta.value.substring(0, ls) + prefix + ta.value.substring(ls);
  ta.focus(); ta.setSelectionRange(ls + prefix.length, ls + prefix.length);
  onEditorChange();
}

function insertList(prefix) {
  const ta = document.getElementById('editor');
  const s = ta.selectionStart;
  const ls = ta.value.lastIndexOf('\n', s - 1) + 1;
  ta.value = ta.value.substring(0, ls) + prefix + ta.value.substring(ls);
  ta.focus(); ta.setSelectionRange(ls + prefix.length, ls + prefix.length);
  onEditorChange();
}

function insertBlock(type) {
  const ta = document.getElementById('editor');
  const s = ta.selectionStart, e = ta.selectionEnd;
  const sel = ta.value.substring(s, e);
  let block = type === 'code'
    ? '\n```\n' + (sel || '// 代码') + '\n```\n'
    : '\n| 列 1 | 列 2 | 列 3 |\n| --- | --- | --- |\n|     |     |     |\n';
  ta.value = ta.value.substring(0, s) + block + ta.value.substring(e);
  ta.focus(); ta.setSelectionRange(s + block.length, s + block.length);
  onEditorChange();
}

// ═══════════════ TAB ═══════════════
function handleTab(e) {
  if (e.key === 'Tab') {
    e.preventDefault();
    const ta = e.target, s = ta.selectionStart;
    ta.value = ta.value.substring(0, s) + '  ' + ta.value.substring(ta.selectionEnd);
    ta.focus(); ta.setSelectionRange(s + 2, s + 2);
    onEditorChange();
  }
}

// ═══════════════ FOCUS MODE ═══════════════
function toggleFocus() {
  focusMode = !focusMode;
  document.body.classList.toggle('focus', focusMode);
  document.getElementById('btnFocus').textContent = focusMode ? '退出专注' : '专注';
  if (focusMode) showToast('专注模式 — 鼠标悬停可唤出面板');
}

// ═══════════════ PREVIEW ═══════════════
function onEditorChange() {
  refreshPreview();
  updateStats();
  updateOutline();
  autoSave();
}

function refreshPreview() {
  const content = document.getElementById('editor').value;
  const preview = document.getElementById('preview');
  if (!content.trim()) {
    preview.innerHTML = '<div class="preview-empty"><span class="icon">¶</span><p>左侧书写，此处实时预览</p></div>';
  } else {
    preview.innerHTML = marked.parse(content);
  }
}

function updateStats() {
  const text = document.getElementById('editor').value.trim();
  const chars = text.replace(/\s/g, '').length;
  const paras = text ? text.split(/\n\n+/).filter(p => p.trim()).length : 0;
  const readMin = Math.max(1, Math.ceil(chars / 500));
  document.getElementById('wordCount').textContent = chars.toLocaleString();
  document.getElementById('paraCount').textContent = paras;
  document.getElementById('readTime').textContent = readMin;
}

// ═══════════════ OUTLINE ═══════════════
function updateOutline() {
  const content = document.getElementById('editor').value;
  const headings = [...content.matchAll(/^(#{2,3})\s+(.+)$/gm)];
  const container = document.getElementById('outlineBody');
  if (headings.length === 0) {
    container.innerHTML = '<div class="outline-empty">标题会出现在这里</div>';
    return;
  }
  container.innerHTML = headings.map((m, i) => {
    const level = m[1].length;
    const text = esc(m[2]);
    return `<a class="outline-item l${level}" onclick="jumpTo(${m.index})" title="${text}">${text}</a>`;
  }).join('');
}

function jumpTo(index) {
  const ta = document.getElementById('editor');
  ta.focus(); ta.setSelectionRange(index, index);
  const lineH = parseInt(getComputedStyle(ta).lineHeight) || 28;
  const lineN = ta.value.substring(0, index).split('\n').length;
  ta.scrollTop = (lineN - 3) * lineH;
  syncOutline();
}

function syncOutline() {
  const ta = document.getElementById('editor');
  const content = ta.value;
  const headings = [...content.matchAll(/^(#{2,3})\s+(.+)$/gm)];
  const lineH = parseInt(getComputedStyle(ta).lineHeight) || 28;
  let active = -1;
  headings.forEach((m, i) => {
    const ln = content.substring(0, m.index).split('\n').length;
    if ((ln * lineH) < ta.scrollTop + 120) active = i;
  });
  document.querySelectorAll('.outline-item').forEach((el, i) => {
    el.classList.toggle('active', i === active);
  });
}

// ═══════════════ COPY ═══════════════
async function copyMarkdown() {
  const title = document.getElementById('titleInput').value.trim();
  const content = document.getElementById('editor').value;
  let md = '';
  if (title) md += '# ' + title + '\n\n';
  if (tags.length) md += '> 标签：' + tags.join('、') + '\n\n';
  md += content;
  await navigator.clipboard.writeText(md);
  showToast('Markdown 已复制');
}

async function copyRichHTML() {
  const title = document.getElementById('titleInput').value.trim();
  const content = document.getElementById('editor').value;
  let html = '';
  if (title) html += '<h1>' + esc(title) + '</h1>\n';
  if (tags.length) html += '<blockquote><p>标签：' + esc(tags.join('、')) + '</p></blockquote>\n';
  html += marked.parse(content);
  const blob = new Blob([html], { type: 'text/html' });
  await navigator.clipboard.write([
    new ClipboardItem({
      'text/html': blob,
      'text/plain': new Blob([stripHtml(html)], { type: 'text/plain' })
    })
  ]);
  showToast('富文本已复制，可直接粘贴到公众号/知乎');
}

async function exportHTML() {
  const title = document.getElementById('titleInput').value.trim() || '未命名';
  const content = document.getElementById('editor').value;
  let body = '';
  if (title) body += '<h1>' + esc(title) + '</h1>\n';
  if (tags.length) body += '<blockquote><p>标签：' + esc(tags.join('、')) + '</p></blockquote>\n';
  body += marked.parse(content);

  const full = '<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width,initial-scale=1.0">\n<title>' + esc(title) + '</title>\n'
    + '<style>body{max-width:680px;margin:60px auto;padding:0 24px;font-family:"Noto Serif SC",STSong,Georgia,serif;font-size:17px;line-height:1.9;color:#242424;}'
    + 'h1{font-family:-apple-system,sans-serif;font-size:32px;font-weight:800;letter-spacing:-.4px;}'
    + 'h2{font-family:-apple-system,sans-serif;font-size:22px;font-weight:700;margin:42px 0 14px;padding-bottom:10px;border-bottom:1px solid #ebeae6;}'
    + 'h3{font-family:-apple-system,sans-serif;font-size:18px;font-weight:700;margin:30px 0 10px;}'
    + 'code{background:#f5f5f2;padding:2px 6px;border-radius:3px;font-size:.88em;color:#c7254e;}'
    + 'pre{background:#1a1a1e;color:#e0e0e0;padding:20px 24px;border-radius:8px;overflow-x:auto;font-size:14px;line-height:1.7;}'
    + 'pre code{background:none;padding:0;color:inherit;}'
    + 'blockquote{border-left:3px solid #d5d3ce;margin:20px 0;padding:8px 20px;color:#555;font-style:italic;}'
    + 'img{max-width:100%;border-radius:6px;}'
    + 'table{border-collapse:collapse;width:100%;}th,td{border:1px solid #e8e6e1;padding:10px 14px;}th{background:#fafaf7;}'
    + 'a{color:#1a56db;}</style>\n</head>\n<body>\n' + body + '\n</body>\n</html>';

  const blob = new Blob([full], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = title + '.html'; a.click();
  URL.revokeObjectURL(url);
  showToast('HTML 文件已下载');
}

// ═══════════════ HELPERS ═══════════════
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function stripHtml(h) { const d = document.createElement('div'); d.innerHTML = h; return d.textContent || ''; }

// ═══════════════ TOAST ═══════════════
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._timer); t._timer = setTimeout(() => t.classList.remove('show'), 1800);
}

// ═══════════════ AUTO-SAVE ═══════════════
function autoSave() {
  localStorage.setItem('draft', JSON.stringify({
    title: document.getElementById('titleInput').value,
    tags: tags,
    content: document.getElementById('editor').value,
    templateId: currentTemplateId,
    time: Date.now()
  }));
  const ind = document.getElementById('saveInd');
  ind.classList.add('visible');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => ind.classList.remove('visible'), 1600);
}

function loadDraft() {
  const raw = localStorage.getItem('draft');
  if (!raw) return;
  try {
    const d = JSON.parse(raw);
    if (!d.content && !d.title) return;
    document.getElementById('titleInput').value = d.title || '';
    document.getElementById('editor').value = d.content || '';
    tags = d.tags || [];
    currentTemplateId = d.templateId || null;
    renderTags();
    showEditor();
    refreshPreview();
    updateStats();
    updateOutline();
  } catch(e) { /* ignore corrupt data */ }
}

// ═══════════════ KEYBOARD ═══════════════
document.addEventListener('keydown', function(e) {
  if (currentView !== 'editor') return;
  const mod = e.ctrlKey || e.metaKey;

  if (mod && e.key === 's') { e.preventDefault(); autoSave(); showToast('已保存'); }
  if (mod && e.key === 'b') { e.preventDefault(); insertMD('**', '**', '粗体'); }
  if (mod && e.key === 'i') { e.preventDefault(); insertMD('*', '*', '斜体'); }
  if (mod && e.key === 'k') { e.preventDefault(); insertMD('[', '](url)', ''); }
  if (mod && e.key === '`') { e.preventDefault(); insertMD('`', '`', ''); }
  if (mod && e.shiftKey && e.key === 'F') { e.preventDefault(); toggleFocus(); }
  if (e.key === 'Escape' && focusMode) { e.preventDefault(); toggleFocus(); }
});

// ═══════════════ INIT ═══════════════
renderGallery();
renderHeaderActions();

(function() {
  var raw = localStorage.getItem('draft');
  if (raw) {
    try {
      var d = JSON.parse(raw);
      if ((d.content || d.title) && confirm('检测到上次未完成的草稿，是否恢复？')) {
        loadDraft();
      } else {
        localStorage.removeItem('draft');
      }
    } catch(e) {}
  }
})();
</script>
