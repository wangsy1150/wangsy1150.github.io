<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>语音交互助手 · 在线演示</title>
<link rel="icon" type="image/svg+xml" href="../../../favicon.svg?v=2" />
<link rel="stylesheet" href="style.css" />
<style>
  /* ---------- 演示版专属：顶部说明条 + 追问区 ---------- */
  .demo-banner{
    position:relative;z-index:5;display:flex;flex-wrap:wrap;gap:10px 16px;
    align-items:center;justify-content:center;
    padding:11px 18px;font-size:13px;line-height:1.5;
    background:linear-gradient(90deg,rgba(124,58,237,.14),rgba(34,211,238,.14));
    border-bottom:1px solid rgba(139,92,246,.22);color:#4b5563
  }
  .demo-banner b{color:#5b21b6;font-weight:600}
  .demo-banner .dot-sep{color:#c4b5fd}
  .demo-banner a{color:#7c3aed;text-decoration:none;border-bottom:1px dashed rgba(124,58,237,.5)}
  .demo-banner a:hover{color:#5b21b6}
  .demo-banner .badge-live{
    display:inline-flex;align-items:center;gap:6px;font-weight:600;color:#0e7490;
    background:rgba(34,211,238,.16);border:1px solid rgba(34,211,238,.4);
    border-radius:999px;padding:3px 11px;font-size:12.5px
  }
  .demo-banner .badge-live::before{
    content:"";width:7px;height:7px;border-radius:50%;background:#06b6d4;
    box-shadow:0 0 0 3px rgba(6,182,212,.22)
  }

  /* 底部追问区：取代真实版的麦克风输入（演示版不能真的调模型） */
  .demo-ask{position:relative;z-index:5;padding:14px 22px 20px;
    border-top:1px solid rgba(148,163,184,.22);background:rgba(255,255,255,.72)}
  .demo-ask-head{font-size:13px;color:#6b7280;margin-bottom:10px}
  .demo-ask-head b{color:#4c1d95}
  .demo-chips{display:flex;flex-wrap:wrap;gap:9px}
  .demo-chip{
    font:inherit;font-size:13.5px;cursor:pointer;
    padding:8px 15px;border-radius:999px;color:#5b21b6;
    background:rgba(139,92,246,.1);border:1px solid rgba(139,92,246,.32);
    transition:.18s
  }
  .demo-chip:hover{background:rgba(139,92,246,.2);border-color:rgba(139,92,246,.55);transform:translateY(-1px)}
  .demo-chip[disabled]{opacity:.5;cursor:not-allowed;transform:none}
  .demo-chip.is-done{background:rgba(16,185,129,.12);border-color:rgba(16,185,129,.4);color:#047857}

  /* 正在播放时的状态点动画 */
  @keyframes demoPulse{0%,100%{opacity:1}50%{opacity:.35}}
  .demo-ask.is-playing .demo-ask-head b::after{
    content:" …";animation:demoPulse 1s ease-in-out infinite
  }

  /* ---------- 布局覆盖：真实版用 height:100vh 撑满，演示版要让「场景按钮」始终可见 ---------- */
  .app{
    height:auto;
    min-height:100vh;
    padding-bottom:0;
  }
  /* 空状态：对话区收紧，别把下面的按钮挤出去 */
  .chat{
    flex:0 0 auto;
    min-height:240px;
    max-height:58vh;
    overflow-y:auto;
  }
  /* 有消息后放开高度，让对话自然铺开 */
  body.has-messages .chat{
    max-height:none;
    min-height:0;
  }
  body.has-messages .empty{ display:none; }

  /* ---------- 修正：命中片段里的换行要保留 ----------
     片段原文带 \n，但 .trace-preview li 默认为 normal，换行会被折叠成空格，
     导致「## 报销流程 先提交发票再由部门主管审批」这种句子糊成一行。 */
  .trace-preview li{ white-space:pre-line; }

  /* ---------- 演示版：给决策卡加一句"怎么读"的注解 ---------- */
  .demo-note{
    margin:12px 0 2px;padding:11px 15px;border-radius:11px;font-size:13px;
    line-height:1.65;color:#4b5563;
    background:rgba(139,92,246,.07);border-left:3px solid rgba(139,92,246,.5)
  }
  .demo-note b{color:#5b21b6}
  .demo-note code{
    font-family:Consolas,Monaco,monospace;font-size:12.5px;color:#5b21b6;
    background:rgba(139,92,246,.14);border-radius:4px;padding:1px 5px
  }

  /* ---------- 内嵌模式：被作品集详情页用 iframe 套住时 ----------
     1) 详情页外面已经有「返回作品集」，这里的返回链接重复且点了会污染 iframe
     2) 去掉 .chat 的内部滚动：改成由父页面统一滚动，
        否则会变成「页面里套一个滚动条」，手机端尤其难操作 */
  body.is-embed .demo-banner a{ display:none; }
  body.is-embed .demo-banner{ padding:9px 16px; font-size:12.5px; }
  body.is-embed .app{ min-height:0; }
  body.is-embed .chat{
    max-height:none; min-height:0; overflow:visible;
  }
  /* 内嵌时彻底不要自身的滚动条（含滚动条槽位）——
     只要它露出一点，就会出现「页面里套一根条」，而且它会吃掉 15px 宽度，
     让高度测量永远差一截。滚动权全部交给父页面。 */
  html.is-embed-html{ overflow:hidden !important; scrollbar-width:none; }
  html.is-embed-html::-webkit-scrollbar,
  body.is-embed::-webkit-scrollbar{ width:0 !important; height:0 !important; display:none !important; }
</style>
</head>
<body>

<!-- ===== 顶部说明条：讲清"这是录播，不是真调模型" ===== -->
<div class="demo-banner">
  <span class="badge-live">真实运行录播</span>
  <span>以下对话是<b>本地真实跑出来</b>的结果，原样回放</span>
  <span class="dot-sep">·</span>
  <span>静态页无法调用 DeepSeek（密钥不能放前端），故此处不接模型</span>
  <span class="dot-sep">·</span>
  <a href="../index.html">← 返回项目详情</a>
</div>

<div class="app">
  <!-- ============ 顶部标题栏（结构同真实版） ============ -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-logo">声</div>
      <div class="brand-text">
        <h1>语音交互助手</h1>
        <p>麦克风说话 → DeepSeek 思考 → edge-tts 朗读（失败自动降级浏览器）</p>
      </div>
    </div>
    <div class="topbar-right">
      <span class="pill" id="modelPill">模型：deepseek-chat</span>
      <span class="pill" id="agentPill">Agent：Function Calling · 1 个工具</span>
      <span class="pill" id="voicePill">朗读：edge-tts · 晓晓</span>
      <span class="pill" id="memoryPill">记忆：1/10 轮</span>
      <span class="pill" id="keyPill">密钥已配置 ✔</span>
    </div>
  </header>

  <!-- ============ 对话区 ============ -->
  <main class="chat" id="chat">
    <div class="empty" id="emptyState">
      <div class="empty-icon">🎙️</div>
      <p>点击下方按钮开始说话</p>
      <p class="empty-sub">也支持直接在输入框里打字提问</p>
    </div>
  </main>

  <!-- ============ 实时状态 ============ -->
  <div class="statusbar">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">准备就绪</span>
    <span class="status-extra" id="statusExtra"></span>
  </div>

  <!-- ============ 演示版互动区 ============ -->
  <footer class="demo-ask" id="demoAsk">
    <div class="demo-ask-head">
      <b>选择一个场景回放</b>（点击后逐字打出真实回答，决策卡同步展开）
    </div>
    <div class="demo-chips" id="demoChips"></div>
  </footer>
</div>

<script src="replay.js"></script>
<script>
'use strict';
/* ============================================================================
 * 演示版回放逻辑
 *
 * 为什么这么做：真实版前端要调 /api/think（Flask），而静态站点没有后端，
 * 且 DeepSeek 密钥绝不能出现在公开前端。所以把「真实运行的输出」录下来回放，
 * 界面与真实版共用同一份 style.css，视觉完全一致。
 *
 * 每个场景的 HTML 都是从真实运行中的 #chat 里直接取的，未经改写。
 * ========================================================================== */

const R = window.VA_REPLAY;
const chat = document.getElementById('chat');
const emptyState = document.getElementById('emptyState');
const statusText = document.getElementById('statusText');
const statusDot = document.getElementById('statusDot');
const demoAsk = document.getElementById('demoAsk');
const chipsBox = document.getElementById('demoChips');

/** 打乱消息顺序用的小工具：把 HTML 字符串切成一条条 .msg 的「薄片」 */
function sliceMessages(html) {
  const parts = [];
  const re = /<div class="msg /g;
  let m, start = -1;
  while ((m = re.exec(html)) !== null) {
    if (start >= 0) parts.push(html.slice(start, m.index));
    start = m.index;
  }
  if (start >= 0) parts.push(html.slice(start));
  return parts;
}

/** 决策卡默认展开还是收起（真实版默认展开，这里保持） */
function keepTraceOpen(node) {
  const btn = node.querySelector('.trace-toggle');
  if (btn) btn.textContent = '收起';
}

let playing = false;

/* 是否被作品集详情页用 iframe 内嵌。
   内嵌时高度由父页面撑开、自身不能滚，此时任何滚动调用都会把父页面的滚动位置带跑
   （实测：父页面 scrollY 从 0 被顶到 800，焦点落到 iframe 上），所以内嵌模式下一律不滚。 */
var EMBED_MODE = false;

function scrollChatToBottom() {
  if (EMBED_MODE) return;
  chat.scrollTo({ top: chat.scrollHeight, behavior: 'smooth' });
}

/** 回放一个场景：逐条消息插入，带打字机效果 */
async function playTurn(turn) {
  if (playing) return;
  playing = true;
  setChipsDisabled(true);

  emptyState.hidden = true;
  chat.innerHTML = '';
  if (!EMBED_MODE) chat.scrollTop = 0;
  document.body.classList.add('has-messages');

  const messages = sliceMessages(turn.html);
  demoAsk.classList.add('is-playing');

  for (const msgHtml of messages) {
    const holder = document.createElement('div');
    holder.innerHTML = msgHtml;
    const node = holder.firstElementChild;
    if (!node) continue;

    const isUser = node.classList.contains('user');
    // 插入时先隐藏，再淡入
    node.style.opacity = '0';
    node.style.transform = 'translateY(8px)';
    node.style.transition = 'opacity .28s ease, transform .28s ease';
    chat.appendChild(node);

    statusText.textContent = isUser ? '识别中…' : '思考中…';
    statusDot.style.background = isUser ? '#f59e0b' : '#8b5cf6';

    requestAnimationFrame(() => {
      node.style.opacity = '1';
      node.style.transform = 'translateY(0)';
    });

    if (isUser) {
      await sleep(620);
    } else {
      // AI 回答：先显示"逐字打出"的观感 —— 用气泡文本做打字机
      const body = node.querySelector('.bubble-body');
      const full = body ? body.textContent : '';
      const trace = node.querySelector('.trace-card');
      if (trace) trace.style.visibility = 'hidden';
      if (body) {
        body.textContent = '';
        await typewrite(body, full);
      }
      await sleep(220);
      if (trace) {
        trace.style.visibility = 'visible';
        trace.style.opacity = '0';
        trace.style.transition = 'opacity .3s ease';
        requestAnimationFrame(() => { trace.style.opacity = '1'; });
        keepTraceOpen(node);
      }
      await sleep(420);
    }
    scrollChatToBottom();
  }

  statusText.textContent = R.pills.status || '已收到回答';
  statusDot.style.background = '#10b981';
  memoryPillSet(turn);
  demoAsk.classList.remove('is-playing');
  appendNote(turn);
  playing = false;
  setChipsDisabled(false);
  markChipDone(turn.id);
}

/** 每个场景看点的简短注解，帮助访客读懂画面 */
const NOTES = {
  chat: '<b>这一轮的关键：它没有查资料。</b>面对「你能帮我做什么」这种闲聊，' +
        '模型判断不需要检索，决策卡直接写 <code>未调用工具，直接回答</code> —— ' +
        '没有为了"显得在干活"而空跑一次检索。这就是 <code>tool_choice:"auto"</code> 生效的证据。',
  kb: '<b>这一轮的关键：它自己决定要查。</b>问的是事实（年假规定），模型先调 ' +
      '<code>search_knowledge_base</code> 检索本地 <code>员工手册.md</code>，' +
      '拿到命中片段后第二轮才作答，答案末尾标注「来源：员工手册.md」。<br>' +
      '注意片段里夹着「报销流程」的内容 —— 那是 <b>BM25 按词频打分带出的相邻段落</b>，' +
      '不是模型编的；真实检索本来就会这样，所以答案还必须自己判断该用哪一段。'
};

function appendNote(turn) {
  const old = document.getElementById('demoNote');
  if (old) old.remove();
  const txt = NOTES[turn.id];
  if (!txt) return;
  const box = document.createElement('div');
  box.className = 'demo-note';
  box.id = 'demoNote';
  box.innerHTML = txt;
  chat.appendChild(box);
  scrollChatToBottom();
}

/** 逐字打出 */
function typewrite(el, text) {
  return new Promise(resolve => {
    const total = text.length;
    // 长回答按比例加速，整体控制在 0.5–1.1 秒内，避免拖沓
    const step = Math.max(1, Math.round(total / 90));
    const delay = Math.min(24, Math.max(9, Math.round(900 / Math.max(1, total / step))));
    let i = 0;
    const timer = setInterval(() => {
      i += step;
      el.textContent = text.slice(0, i);
      if (i >= total) {
        el.textContent = text;
        clearInterval(timer);
        resolve();
      }
      if (!EMBED_MODE) chat.scrollTop = chat.scrollHeight;
    }, delay);
  });
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

/** 同步"记忆 N/10 轮"标签（照真实版的语义） */
function memoryPillSet(turn) {
  const pill = document.getElementById('memoryPill');
  const n = turn.id === 'kb' ? 1 : 2;
  pill.textContent = '记忆：' + n + '/10 轮';
}

function setChipsDisabled(v) {
  chipsBox.querySelectorAll('button').forEach(b => { b.disabled = v; });
}

function markChipDone(id) {
  const b = chipsBox.querySelector('[data-turn="' + id + '"]');
  if (b) b.classList.add('is-done');
}

/* ---------- 内嵌模式：把自身高度报给父页面 ----------
   作品集详情页用 iframe 套这个页面时，如果 iframe 高度固定，
   就会出现「页面里套一根滚动条」。这里把真实内容高度报上去，
   让父页面把 iframe 撑到刚好，滚动权交回父页面，手机端也不会卡住。 */
function reportHeight() {
  if (window.parent === window) return;
  const h = Math.ceil(Math.max(
    document.body.scrollHeight,
    document.documentElement.scrollHeight
  ));
  window.parent.postMessage({ type: 'va-demo-height', height: h }, '*');
}

/* ---------- 初始化 ---------- */
(function init() {
  const params = new URLSearchParams(location.search);

  // 内嵌模式：藏掉返回链接 + 让高度自适应
  if (params.get('embed') === '1') {
    EMBED_MODE = true;
    document.body.classList.add('is-embed');
    /* 关键：彻底去掉自身的滚动条（连槽位也不要）。
       否则会死循环 —— 滚动条占 15px → clientHeight 变小 → 更要滚动条 → 高度永远差一截。
       滚动权完全交给父页面。 */
    document.documentElement.classList.add('is-embed-html');
    /* 用 MutationObserver 而不是 ResizeObserver：
       实测 ResizeObserver 观察 body 在这个 iframe 场景下不触发回调，
       而对话内容是一条条插进来的，DOM 变化最可靠。 */
    var pending = false;
    var mo = new MutationObserver(function () {
      if (pending) return;
      pending = true;
      requestAnimationFrame(function () { pending = false; reportHeight(); });
    });
    mo.observe(document.body, { childList: true, subtree: true, characterData: true });
    setTimeout(reportHeight, 260);
    window.addEventListener('load', reportHeight);
  }

  // 侧栏标签用真实导出值覆盖
  if (R.pills) {
    const map = { modelPill: 'model', agentPill: 'agent',
                  voicePill: 'voice', memoryPill: 'memory', keyPill: 'key' };
    Object.keys(map).forEach(id => {
      const v = R.pills[map[id]];
      if (v) document.getElementById(id).textContent = v;
    });
  }

  // 生成场景按钮
  R.turns.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'demo-chip';
    btn.type = 'button';
    btn.dataset.turn = t.id;
    btn.textContent = t.label;
    btn.addEventListener('click', () => playTurn(t));
    chipsBox.appendChild(btn);
  });

  statusText.textContent = '准备就绪';
  statusDot.style.background = '#10b981';

  /* ---------- 自动播放（首屏零点击就能看到效果） ----------
     访客打开页面时不需要点任何东西，第一个场景自己开始播。
     播完就停，把第二个场景留给访客点 —— 不循环，避免页面一直在动分散注意力。
     想关掉自动播放：在地址后加 ?autoplay=0 */
  if (params.get('autoplay') !== '0' && R.turns && R.turns.length) {
    setTimeout(() => { playTurn(R.turns[0]); }, 1000);
  }
})();
</script>
</body>
</html>
